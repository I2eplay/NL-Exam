<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อสอบสัตวแพทย์ 2020/2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans, 'Sarabun', sans-serif);background:var(--color-background-primary, #fff)}
.quiz-wrap{display:flex;gap:0;min-height:600px;border:0.5px solid var(--color-border-tertiary, #e5e7eb);border-radius:var(--border-radius-lg, 12px);overflow:hidden;background:var(--color-background-primary, #fff)}
.main{flex:1;padding:2rem;display:flex;flex-direction:column;gap:1.5rem;min-width:0}
.sidebar{width:220px;border-left:0.5px solid var(--color-border-tertiary, #e5e7eb);background:var(--color-background-secondary, #f9fafb);padding:1.25rem;display:flex;flex-direction:column;gap:1rem;flex-shrink:0}
.progress-bar-wrap{background:var(--color-border-tertiary, #e5e7eb);border-radius:999px;height:6px;overflow:hidden}
.progress-bar{height:6px;border-radius:999px;background:#1D9E75;transition:width 0.3s}
.q-meta{font-size:13px;color:var(--color-text-secondary, #6b7280)}
.q-num{font-size:22px;font-weight:500;color:var(--color-text-primary, #111827)}
.q-text{font-size:15px;line-height:1.7;color:var(--color-text-primary, #111827)}
.keyword{font-size:12px;color:var(--color-text-tertiary, #9ca3af);font-style:italic}
.options{display:flex;flex-direction:column;gap:10px;margin-top:0.5rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:0.5px solid var(--color-border-tertiary, #e5e7eb);border-radius:var(--border-radius-md, 8px);cursor:pointer;transition:background 0.15s,border-color 0.15s;background:var(--color-background-primary, #fff);text-align:left;font-size:14px;color:var(--color-text-primary, #111827);line-height:1.5;width:100%}
.opt:hover{background:var(--color-background-secondary, #f9fafb);border-color:var(--color-border-secondary, #d1d5db)}
.opt.selected{border-color:#1D9E75;background:#E1F5EE;color:#085041}
.opt.correct{border-color:#1D9E75;background:#E1F5EE;color:#085041}
.opt.wrong{border-color:#D85A30;background:#FAECE7;color:#4A1B0C}
.opt-label{font-weight:500;min-width:16px;flex-shrink:0}
.nav{display:flex;gap:10px;margin-top:auto}
.btn{padding:8px 20px;border:0.5px solid var(--color-border-secondary, #d1d5db);border-radius:var(--border-radius-md, 8px);background:var(--color-background-primary, #fff);color:var(--color-text-primary, #111827);font-size:14px;cursor:pointer;transition:background 0.15s;font-family:inherit}
.btn:hover{background:var(--color-background-secondary, #f9fafb)}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.btn-primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-primary:hover{background:#0F6E56}
.sidebar-title{font-size:13px;font-weight:500;color:var(--color-text-secondary, #6b7280);text-transform:uppercase;letter-spacing:0.05em}
.total-num{font-size:32px;font-weight:500;color:var(--color-text-primary, #111827)}
.total-label{font-size:12px;color:var(--color-text-secondary, #6b7280);margin-top:2px}
.score-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary, #e5e7eb)}
.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px;max-height:340px;overflow-y:auto}
.q-dot{width:28px;height:28px;border-radius:var(--border-radius-md, 6px);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-tertiary, #e5e7eb);background:var(--color-background-primary, #fff);color:var(--color-text-secondary, #6b7280);transition:background 0.1s}
.q-dot:hover{background:var(--color-background-secondary, #f9fafb)}
.q-dot.current{border-color:#1D9E75;color:#0F6E56;font-weight:500}
.q-dot.answered{background:#9FE1CB;border-color:#5DCAA5;color:#085041}
.q-dot.correct-dot{background:#9FE1CB;border-color:#5DCAA5;color:#085041}
.q-dot.wrong-dot{background:#F5C4B3;border-color:#F0997B;color:#4A1B0C}
.answer-reveal{margin-top:0.5rem;padding:10px 14px;border-radius:var(--border-radius-md, 8px);font-size:14px;border:0.5px solid #5DCAA5;background:#E1F5EE;color:#085041}
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="main">
    <div>
      <div class="q-meta" id="q-meta">ข้อ 1 จาก 100</div>
      <div class="q-num" id="q-num">ข้อ 1</div>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="keyword" id="q-kw"></div>
    <div class="options" id="options"></div>
    <div id="answer-box" style="display:none" class="answer-reveal"></div>
    <div class="nav">
      <button class="btn" id="btn-prev" onclick="go(-1)">← ย้อนกลับ</button>
      <button class="btn btn-primary" id="btn-next" onclick="go(1)">ถัดไป →</button>
    </div>
  </div>
  <div class="sidebar">
    <div>
      <div class="sidebar-title">ความคืบหน้า</div>
      <div class="progress-bar-wrap" style="margin-top:8px">
        <div class="progress-bar" id="prog" style="width:1%"></div>
      </div>
    </div>
    <div>
      <div class="total-num" id="total-num">100</div>
      <div class="total-label">ข้อทั้งหมด</div>
    </div>
    <div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;padding:8px;border-radius:var(--border-radius-md,8px);background:var(--color-background-secondary,#f9fafb);text-align:center">
          <div style="font-size:18px;font-weight:500;color:#0F6E56" id="score-correct">0</div>
          <div style="font-size:11px;color:var(--color-text-secondary,#6b7280)">ถูก</div>
        </div>
        <div style="flex:1;padding:8px;border-radius:var(--border-radius-md,8px);background:var(--color-background-secondary,#f9fafb);text-align:center">
          <div style="font-size:18px;font-weight:500;color:#993C1D" id="score-wrong">0</div>
          <div style="font-size:11px;color:var(--color-text-secondary,#6b7280)">ผิด</div>
        </div>
      </div>
    </div>
    <div>
      <div class="sidebar-title" style="margin-bottom:6px">นำทาง</div>
      <div class="q-grid" id="q-grid"></div>
    </div>
  </div>
</div>

<script>
const questions = [
  {n:1, q:"ตรวจ histopath พบ neutrophil, macrophage และ fibrin exudate ในตำแหน่งใกล้ๆ purkinje โครงสร้างที่มีปัญหาคือส่วนใด", opts:["Myocardium","Pericardium","Endocardium","Subendocardium","Epicardium"], ans:3},
  {n:2, q:"ให้รูป milk spot ที่ตับ ถามว่าติดพยาธิอะไร", opts:["Ascarid spp.","Trichurid vulpis","Tenia solium","Strongyle ransomi","Trichinella spiralis"], ans:0},
  {n:3, q:"สามารถเก็บเลือดหมาที่เป็น donor 35 กก ได้มากสุดเท่าไร", opts:["400 ml","500 ml","150 ml","700 ml","1000 ml"], ans:1},
  {n:4, q:"ม้า 400 kg ให้อาหารเม็ด 1.5 kg หญาแพงโกลา 6 kg โดยแบ่งให้ 3 มื้อต่อวัน และมีน้ำใส่ในถัง 20 ลิตร มีการทำความสะอาดแล้วเติมน้ำให้ตอนมื้อเช้า ถามว่าอะไรดูเป็นปัญหา", opts:["ปริมาณอาหารเม็ด","ปริมาณหญ้า","จำนวนมื้อในการให้อาหาร","ความจุของถังน้ำ","จำนวนครั้งที่เติมน้ำ"], ans:3},
  {n:5, q:"หมูอนุบาลพบ coccidia ใช้สารอะไรทำความสะอาดพื้นคอก", opts:["Phenol","Iodophore","Gluteraldehyde","Sodium bicarbonate","Sodium hypochlorite"], ans:4},
  {n:6, q:"สุกรอนุบาล 4-5 สัปดาห์ป่วยแคระแกรน ขนหยอง อัตราการป่วย 20% อัตราการตาย 5% ผ่าซากพบ fibrinopurulent pleuritis, fibrinopurulent peritonitis ผ่าซากแล้วคาดว่าเกิดจากเชื้อสาเหตุใด", opts:["Pasteurellosis","Bordetellosis","Mycoplasmosis","Streptococcosis","Glasser's disease"], ans:4},
  {n:7, q:"แบคทีเรียใดที่มีความสำคัญในอุตสาหกรรมอาหาร สามารถทำให้เกิด biofilm ได้", opts:["Bacillus cereus","Vibrio parahaemolyticus","Clostridium botulinum","Listeria monocytogenes","Mycobacterium paratuberculosis"], ans:3},
  {n:8, q:"สุนัขอายุ 5 ปี เจ็บตา ย้อมสีติด Fluorescein ที่กระจกตา ห้ามใช้ยาหยอดตาอะไร", opts:["Nystatin","Ketorolac","Hyaluronate","Fluorometholone","Hydroxypropyl methylcellulose"], ans:3},
  {n:9, q:"สารฆ่าเชื้อสำหรับทำความสะอาดอาหารสดเพื่อบริโภคในปลา", opts:["Choline","Formalin","CuSO4","NaOH","KMnO4"], ans:4},
  {n:10, q:"หมูทำการ postmortem inspection โอกาสเจอปรสิตด้วยตาเปล่า ที่บริเวณกล้ามเนื้อ Masseter", opts:["Taenia saginata","Trichuris suis","Trichinella spiralis","Cysticercus cellulosae","Trichostrongylus"], ans:3},
  {n:11, q:"คนเป็นแผลบวมแดง สะเก็ดดำ เคยสัมผัสวัวที่ตายแบบพลัน มีเลือดออกปาก จมูก ทวาร เกิดจากเชื้อสาเหตุอะไร", opts:["Pasteurella multocida","Staphylococcus aureus","Bacillus anthracis","Brucella abortus","Orientia tsutsugamushi"], ans:2},
  {n:12, q:"หมา 7 ปี ไอ หายใจเสียงดัง crackle lung sound, systolic murmur จากภาพเอกซเรย์พบ left heart enlargement", opts:["Pulmonic stenosis","Mitral stenosis","Aortic regurgitation","Mitral regurgitation","Ventricular septal defect"], ans:3},
  {n:13, q:"ปลาบอลลูนจำนวน 50 ตัว เลี้ยงในตู้กระจกขนาด 14 นิ้วไม่มีระบบกำจัดของเสีย ปลาทั้งหมดตายหลังจากที่เลี้ยง 2 วัน ข้อใดเป็นสาเหตุ", opts:["Nitrite toxicity","Nitrate toxicity","Chlorine toxicity","Ammonia toxicity","Organophosphate toxicity"], ans:3},
  {n:14, q:"ไก่พ่อแม่พันธุ์อายุ 6 เดือนซึม กินอาหารและน้ำลดลง ไอ จาม น้ำมูกน้ำตาไหล บางครั้งสะบัดหัวอย่างรุนแรง และพบสิ่งคัดหลั่งมีลักษณะเป็นเลือดสด กระจายอยู่โดยรอบ อัตราการป่วยร้อยละ 80", opts:["ND","AI","IB","IBD","ILT"], ans:4},
  {n:15, q:"ม้าพ่อพันธุ์มีประวัติขึ้นผสมเมื่อ 5 วันก่อน หลังจากนั้นพบว่าบริเวณ penis มีตุ่มใสในช่วงแรกและกลายเป็นตุ่มหนอง มีอาการเจ็บ ไม่อยากขึ้นผสม ควรใช้เวชภัณฑ์ใด", opts:["vaccination","ivermectin","Prednisolone","Dexamethasone","neomycin ointment"], ans:4},
  {n:16, q:"ยาฆ่าเชื้อที่ได้ประสิทธิภาพในการฆ่าพาหะของ AHS (ยาฆ่าแมลง)", opts:["fipronil","pyrethroid","Imidacloprid","Amitraz",""], ans:1},
  {n:17, q:"หนูทดลองฉีดยาฆ่าเชื้อราเข้าสมอง หลังจากจบการทดลอง ต้องจัดการกับสัตว์ทดลองอย่างไรตาม พรบ. สัตว์ทดลอง", opts:["ทำให้ตายอย่างสงบ","บริจาคให้คนที่ต้องการรับไปเลี้ยง","นำไปทดลองการทดลองอื่นๆ","ขายออกสู่ตลาดสัตว์เลี้ยง","เลี้ยงต่อจนหมดอายุขัย"], ans:0},
  {n:18, q:"แมวปกติอายุ 3 เดือน ตรวจ test kit FIV + ก่อนทำวัคซีน ต้องตรวจเลือดซ้ำอีกครั้งกี่เดือน", opts:["3.5","6","8","10","12"], ans:1},
  {n:19, q:"สุนัขพันธุ์โกลเดน ชอบสะบัดหู ทำการวินิจฉัยเบื้องต้นพบว่าเป็นหูอักเสบ สัตวแพทย์สว็อปเชื้อไปย้อมสีพบ สุนัขติดเชื้ออะไร", opts:["Malassezia","Candida","Cocci bacteria","Rod bacteria",""], ans:0},
  {n:20, q:"สุนัขกระพริบตาไม่ได้เกิดความผิดปกติที่ nerve ไหน", opts:["CN2","CN3","CN4","CN6","CN7"], ans:4},
  {n:21, q:"สุนัขชิสุ ตาเจ็บ น้ำตาไหล มี Ocular discharge ตรวจตาทั้งสองข้างพบ superficial corneal vascularization ตรวจ STT=5 mm/นาที IOP = 15 mmHg สุนัขเป็นโรคใด", opts:["Cataract","KCS","Glaucoma","Blindness",""], ans:1},
  {n:22, q:"ม้ามีขี้มูกสีเขียวไหลจากจมูก นำไปเพาะเชื้อพบเป็น Streptococcus equi ฟาร์มควรมีการจัดการป้องกันอย่างไร", opts:["การุณยฆาต","ทำวัคซีน","ให้ Penicillin กับม้าตัวที่ยังไม่ป่วย","แยกอุปกรณ์ที่ใช้ในฟาร์ม","นำม้าตัวที่ป่วยออกจากฟาร์ม"], ans:3},
  {n:23, q:"สุนัขโดนรถชนมาแล้ว 4 สัปดาห์ กล้ามเนื้อสะบักซ้ายฝ่อลีบจนเห็น Scapula spine เส้นประสาทใดต่อไปนี้ที่ได้รับความเสียหาย", opts:["Brachial plexus","Suprascapular n.","Infrascapular n.","Thoracodorsal n.","Subscapular n."], ans:1},
  {n:24, q:"ปลานิลเลี้ยงในกระชัง อัตราการป่วย 70% ปลามีอาการว่ายน้ำควงสว่าน ตาโปน เมื่อผ่าซากพบว่าตับ ม้าม ไต บวม ปลาเป็นโรคอะไร", opts:["Nocardiosis","Aeromonasis","Edwardsiellosis","Streptococcosis","Flavobacteriosis"], ans:3},
  {n:25, q:"แม่โคนม อายุ 4 ปี พึ่งคลอดลูกมา 2 วัน มีอาการล้มนอน ลุกไม่ได้ ตรวจร่างกายพบกล้ามเนื้อสั่น ขาหลังกระตุก อุณหภูมิร่างกายต่ำ หัวใจเต้นเร็ว เวชภัณฑ์ใดที่เหมาะสมในการรักษาโคตัวนี้", opts:["Glucose","Vitamin E","Dexamethasone","Propylene glycol","Calcium borogluconate"], ans:4},
  {n:26, q:"อาการในข้อใดต่อไปนี้ที่สามารถพบได้ในลูกสุนัขที่เป็น Persistent Right Aortic Arch, Vascular ring anomaly", opts:["Gagging","Vomiting","Diarrhea","Regurgitation","Dysautonomia"], ans:3},
  {n:27, q:"การวินิจฉัยระบบโครงร่างในม้า ด้วยวิธี toe-elevation test ใช้วินิจฉัยปัญหาในข้อใดต่อไปนี้", opts:["Thrush","Laminitis","Seedy toe","Chip fragment","Navicular syndrome"], ans:4},
  {n:28, q:"สุกรขุน 16 สัปดาห์ซึม แคระแกร็น ถ่ายสีดำ หอบ ป่วย 10-15% ผ่าซากพบต่อมน้ำเหลืองโตทั่วร่างกาย ส่องกล้องพบ basophilic intracytoplasmic inclusion bodies สาเหตุคือ", opts:["gastric ulcer","mycotoxicosis","Swine dysentery","porcine circovirus associated disease","PRRS"], ans:3},
  {n:29, q:"Edwardsiella tarda ในอวัยวะภายในของปลาดุกอุย ใช้ยาอะไร", opts:["colistin","Amoxicillin","Gentamycin","Tetracycline","Enrofloxacin"], ans:3},
  {n:30, q:"Genotype ของ Yellow head syndrome ในกุ้งกุลาดำคือ", opts:["1","2","3","4","5"], ans:0},
  {n:31, q:"รอยโรคของ Ichthyophthirius multifilis", opts:["แผลหลุมสีดำที่ผิวหนัง","ซีดที่ตัวกับครีบ","ผิวหนังมีแผลหลุม และมีแดง","ซีด มีจุดน้ำตาลที่ผิวหนัง","จุดขาวกระจายตามลำตัวและเหงือก"], ans:4},
  {n:32, q:"สุนัขเป็นเนื้องอกที่ถุงข้างก้น ต้องผ่าตัดผ่านกล้ามเนื้ออะไร", opts:["Rectococcygeus muscle","External rectal sphincter","Coccygeus","Levator ani","Caudal gluteal"], ans:3},
  {n:33, q:"brachial plexus nerve block แล้วกล้ามเนื้อบริเวณหัวไหล่เล็กลงกว่าปกติเห็น scapular spine ชัดเจน ฉีดโดน nerve อะไร", opts:["Radial n.","Axillary n.","Subscapular n.","Suprascapular n.","musculocutaneous n."], ans:3},
  {n:34, q:"อาการ Wobbly hedgehog syndrome (WHS) เกี่ยวข้องกับระบบใด", opts:["nervous","Reproductive","Urinary","Cardiovascular","Gastrointestinal"], ans:0},

  {n:150, q:"ข้อใดคือน้ำหนักรวมของไก่เนื้อต่อพื้นที่การเลี้ยง 1 ตารางเมตร ตามระเบียบกรมปศุสัตว์ 2554", opts:["32 kg/m²","33 kg/m²","34 kg/m²","35 kg/m²","36 kg/m²"], ans:3}
];

const labels = ['ก','ข','ค','ง','จ'];
let cur = 0;
let userAns = new Array(questions.length).fill(-1);
let revealed = new Array(questions.length).fill(false);

function render() {
  const q = questions[cur];
  const total = questions.length;
  document.getElementById('q-meta').textContent = `ข้อ ${q.n} (${cur+1}/${total})`;
  document.getElementById('q-num').textContent = `ข้อ ${q.n}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-kw').textContent = '';
  document.getElementById('prog').style.width = Math.max(1, Math.round((cur+1)/total*100))+'%';
  document.getElementById('total-num').textContent = total;

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o, i) => {
    if(!o) return;
    const btn = document.createElement('button');
    btn.className = 'opt';
    if(revealed[cur]) {
      if(i === q.ans) btn.classList.add('correct');
      else if(i === userAns[cur] && userAns[cur] !== q.ans) btn.classList.add('wrong');
    } else if(userAns[cur] === i) btn.classList.add('selected');
    btn.innerHTML = `<span class="opt-label">${labels[i] || (i+1)+'.'}</span><span>${o}</span>`;
    btn.onclick = () => pick(i);
    if(revealed[cur]) btn.disabled = true;
    opts.appendChild(btn);
  });

  const ab = document.getElementById('answer-box');
  if(revealed[cur] && q.ans >= 0) {
    ab.style.display = 'block';
    ab.textContent = `✓ เฉลย: ${labels[q.ans]}. ${q.opts[q.ans]}`;
  } else {
    ab.style.display = 'none';
  }

  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').textContent = cur === total-1 ? 'สรุปผล' : 'ถัดไป →';

  let correct = 0, wrong = 0;
  userAns.forEach((a, i) => {
    if(a >= 0 && revealed[i]) {
      if(a === questions[i].ans) correct++;
      else wrong++;
    }
  });
  document.getElementById('score-correct').textContent = correct;
  document.getElementById('score-wrong').textContent = wrong;
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'q-dot';
    d.textContent = q.n;
    d.title = `ข้อ ${q.n}`;
    if(i === cur) d.classList.add('current');
    if(revealed[i]) {
      if(userAns[i] === questions[i].ans) d.classList.add('correct-dot');
      else if(userAns[i] >= 0) d.classList.add('wrong-dot');
      else d.classList.add('answered');
    } else if(userAns[i] >= 0) d.classList.add('answered');
    d.onclick = () => { cur = i; render(); };
    grid.appendChild(d);
  });
}

function pick(i) {
  if(revealed[cur]) return;
  userAns[cur] = i;
  revealed[cur] = true;
  render();
}

function go(dir) {
  const total = questions.length;
  if(dir > 0 && cur === total-1) {
    let correct = 0, wrong = 0, skipped = 0;
    userAns.forEach((a, i) => {
      if(a < 0) skipped++;
      else if(a === questions[i].ans) correct++;
      else wrong++;
    });
    alert(`📊 สรุปผลการสอบ\n✅ ถูก: ${correct}\n❌ ผิด: ${wrong}\n⏭ ยังไม่ตอบ: ${skipped}\n\n🎯 คะแนน: ${correct}/${total} (${Math.round(correct/total*100)}%)`);
    return;
  }
  cur = Math.max(0, Math.min(total-1, cur+dir));
  render();
}

render();
</script>
</body>
