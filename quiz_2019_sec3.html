  {id:139,q:"139. กล้ามเนื้อใดที่ใช้ตรวจหา Cysticercus cellulosae จากซากสุกรที่ใช้บริโภคในโรงฆา",opts:[{key:"ก",text:"Gluteus"},{key:"ข",text:"Masseter"},{key:"ค",text:"Hamstring"},{key:"ง",text:"Longissimus"},{key:"จ",text:"Gastrocnemius"}],answer:"ข",explanation:"Masseter muscle (กล้ามเนื้อกราม) เป็นกล้ามเนื้อที่ต้องตรวจบังคับตาม meat inspection standard สำหรับ Taenia solium (Cysticercus cellulosae) ในสุกร",ref:"Gracey JF et al. Meat Hygiene. 10th ed. Saunders; 1999."},
  {id:140,q:"140. มาตรฐานในอาหารใดที่ต้องกำหนด Critical limit",opts:[{key:"ก",text:"GAP"},{key:"ข",text:"GMP"},{key:"ค",text:"HACCP"},{key:"ง",text:"ISO 9000"},{key:"จ",text:"ISO 14000"}],answer:"ค",explanation:"HACCP (Hazard Analysis and Critical Control Points) กำหนด Critical Limits ที่แต่ละ CCP เพื่อควบคุมอันตราย เป็นหัวใจสำคัญของระบบ HACCP",ref:"Codex Alimentarius HACCP System. CAC/RCP 1-1969."},
  {id:141,q:"141. สุนัขอายุ 2 ปี ผ่าตัดแก้ไขกระดูก ค่าเลือดปกติ ให้ยาสลบ Isoflurane ให้สารน้ำ LRS 5 ml/kg/h, HR 80, ความดัน 168/86, อยู่ใน stage 3 plane 2 ต้องแก้ไขอะไร",opts:[{key:"ก",text:"ให้ atropine"},{key:"ข",text:"ให้ dopamine"},{key:"ค",text:"เพิ่มอัตราการให้สารน้ำ"},{key:"ง",text:"เพิ่มอัตราการหายใจ"},{key:"จ",text:"เฝ้าระวังต่อไป"}],answer:"จ",explanation:"HR 80, BP 168/86, Stage 3 plane 2 เป็นระดับการสลบที่เหมาะสมสำหรับการผ่าตัด สัญญาณชีพอยู่ในเกณฑ์ปกติ ไม่จำเป็นต้องแก้ไขอะไร เฝ้าระวังต่อไป",ref:"Tranquilli WJ et al. Lumb & Jones' Veterinary Anesthesia. 4th ed. Blackwell; 2007."},
  {id:142,q:"142. เลือกวัสดุเย็บ UB อักเสบร่วมกับการติดเชื้อและมีนิ่ว",opts:[{key:"ก",text:"Catgut"},{key:"ข",text:"Polyglactin 910"},{key:"ค",text:"Polyglycolic acid"},{key:"ง",text:"Polydioxanone"},{key:"จ",text:"Polyester"}],answer:"ง",explanation:"Polydioxanone (PDS) เป็น monofilament absorbable suture ทนต่อการติดเชื้อได้ดีกว่า multifilament เพราะไม่มีร่องให้แบคทีเรียสะสม และสลายตัวช้ากว่า vicryl เหมาะกับ UB ที่มีการติดเชื้อ",ref:"Fossum TW. Small Animal Surgery. 4th ed. Mosby; 2013."},
  {id:143,q:"143. การทำภาพ x-ray โดยเปลี่ยนจาก latent image เป็น visible image อยู่ในขั้นตอนใด",opts:[{key:"ก",text:"Fixing"},{key:"ข",text:"Drying"},{key:"ค",text:"Washing"},{key:"ง",text:"Rinsing"},{key:"จ",text:"Developing"}],answer:"จ",explanation:"Developing (การล้างฟิล์ม) เป็นขั้นตอนที่ latent image (ไม่มองเห็น) ถูกเปลี่ยนเป็น visible image โดย developer solution กระตุ้น silver bromide crystals",ref:"Thrall DE. Textbook of Veterinary Diagnostic Radiology. 6th ed. Saunders; 2013."},
  {id:144,q:"144. ฟาร์ม 1,200 แม่ มี average parturition 3.4, farrowing rate 88%, replacement rate 38%, litter size 12 และ pig wean mortality 15% ค่าใดที่ส่งผลต่อ ลูกหย่านม/แม่/ปี",opts:[{key:"ก",text:"Average parturition"},{key:"ข",text:"Farrowing rate"},{key:"ค",text:"Replacement rate"},{key:"ง",text:"Litter size"},{key:"จ",text:"Pig wean mortality"}],answer:"ง",explanation:"Litter size ส่งผลโดยตรงต่อจำนวนลูกหย่านม/แม่/ปี สูตร: Pigs weaned/sow/year = Litter size × farrowing rate × 365/(lactation+wean-to-service interval+gestation)",ref:"Zimmerman JJ et al. Diseases of Swine. 10th ed. Wiley-Blackwell; 2012."},
  {id:145,q:"145. ข้อใดต่อไปนี้เป็นภาวะที่ต้องแก้ไขปัญหาโดยใช้ Buhner หรือ Gerlach needle",opts:[{key:"ก",text:"Cystocentesis"},{key:"ข",text:"Rectal prolapse"},{key:"ค",text:"Cesarean section"},{key:"ง",text:"Uterine prolapse"},{key:"จ",text:"Caslick's operation"}],answer:"จ",explanation:"Caslick's operation คือการเย็บลด vulva opening ในแม่ม้า ใช้ Gerlach needle สำหรับเย็บ perineum ป้องกัน pneumovagina และ urovagina",ref:"Noakes DE et al. Veterinary Reproduction and Obstetrics. 9th ed. Saunders; 2009."},
  {id:146,q:"146. แมวเพศเมีย อายุ 8 ปี ก้อนเนื้องอกบริเวณเต้านมคู่ที่ 3 ทางด้านซ้าย ผลทางจุลพยาธิพบ mammary adenocarcinoma ข้อใดเป็นวิธีการผ่าตัดที่เหมาะสมที่สุด",opts:[{key:"ก",text:"Lumpectomy"},{key:"ข",text:"Simple mastectomy"},{key:"ค",text:"Regional mastectomy"},{key:"ง",text:"Bilateral mastectomy"},{key:"จ",text:"Unilateral mastectomy"}],answer:"จ",explanation:"Unilateral mastectomy (ตัดเต้านมทั้งแถวข้างซ้าย) เป็นการรักษามาตรฐานสำหรับ mammary adenocarcinoma ในแมว เพราะ lymphatic drainage ของเต้านมในแถวเดียวกันเชื่อมต่อกัน",ref:"Fossum TW. Small Animal Surgery. 4th ed. Mosby; 2013."},
  {id:147,q:"147. สัตวแพทย์ผู้ตรวจประเมินระบบ HACCP พบว่าโรงฆาสุกรแห่งหนึ่ง ไม่มีระบุขนาดของโลหะที่ตรวจจับด้วย metal detector โรงฆาสุกรแห่งนี้ปฏิบัติไม่สอดคล้องกับหลักการใดใน HACCP",opts:[{key:"ก",text:"Validation"},{key:"ข",text:"Monitoring"},{key:"ค",text:"CCP determination"},{key:"ง",text:"Critical limit establishment"},{key:"จ",text:"Flow diagram construction"}],answer:"ง",explanation:"Critical limit establishment คือการกำหนดค่าจำกัดที่วัดได้ที่แต่ละ CCP เช่น ขนาดโลหะที่ตรวจพบได้ต่ำสุด ถ้าไม่มีการระบุขนาดนี้ถือว่าไม่มี critical limit",ref:"Codex Alimentarius HACCP System. CAC/RCP 1-1969."},
  {id:148,q:"148. แมวท้องผูกเรื้อรัง ให้ภาพ x-ray มาดังรูป ควรแก้ไขด้วยวิธีใด",opts:[{key:"ก",text:"Colopexy"},{key:"ข",text:"Subtotal colectomy"},{key:"ค",text:"Segmental colectomy"},{key:"ง",text:"Multiple colotomy"},{key:"จ",text:"Longitudinal strip removal of colon"}],answer:"ข",explanation:"Megacolon ในแมวที่ไม่ตอบสนองต่อการรักษาด้วยยา รักษาด้วย Subtotal colectomy เอาลำไส้ใหญ่ที่ขยายออกเกือบทั้งหมด ให้ผลดีในระยะยาว",ref:"Fossum TW. Small Animal Surgery. 4th ed. Mosby; 2013."},
  {id:149,q:"149. แมวมีอาการ strongly regenerative anemia เมื่อสองกล้องดูพบลักษณะเม็ดเลือดแดงผิดปกติดังภาพ ภาวะผิดปกตินี้คืออะไร",opts:[{key:"ก",text:"IMHA"},{key:"ข",text:"Iron deficiency"},{key:"ค",text:"Blood loss"},{key:"ง",text:"Aplastic anemia"},{key:"จ",text:"EPO deficiency anemia"}],answer:"ข",explanation:"Iron deficiency anemia เป็น regenerative anemia ที่เม็ดเลือดแดงมีลักษณะ microcytic hypochromic ภาพ blood smear พบ poikilocytes, target cells",ref:"Weiss DJ, Wardrop KJ. Schalm's Veterinary Hematology. 6th ed. Wiley-Blackwell; 2010."},
  {id:150,q:"150. ม้ามีอาการคัน เอาลำตัวส่วนท้ายถูคอก สงสัยว่าเป็นพยาธิ จะตรวจอย่างไร",opts:[{key:"ก",text:"ขูดผิวหนังหาไร"},{key:"ข",text:"ล้วงเก็บอุจจาระจาก rectum เพื่อหาไข่พยาธิ"},{key:"ค",text:"Scotch tape แปะรูกนหาไข่พยาธิ"},{key:"ง",text:"Biopsy skin หาตัวอ่อนพยาธิ"},{key:"จ",text:"เจาะเลือดหาตัวอ่อนพยาธิ"}],answer:"ค",explanation:"Oxyuris equi (Pinworm) ในม้าทำให้คันบริเวณรูทวาร ม้าถูกับวัตถุ ตรวจโดย Scotch tape test แปะรอบรูทวารตอนเช้าก่อนอาบน้ำเพื่อเก็บไข่พยาธิ",ref:"Taylor MA et al. Veterinary Parasitology. 3rd ed. Blackwell; 2007."}
];

let current = 0;
const state = { answered: {}, bookmarks: new Set() };

function render() {
  const q = QUESTIONS[current];
  const ans = state.answered[current];
  const isAnswered = ans !== undefined;

  document.getElementById('qNumBadge').textContent = `ข้อ ${q.id}`;
  const bm = document.getElementById('bookmarkBtn');
  if (state.bookmarks.has(current)) { bm.textContent = '★ บันทึกแล้ว'; bm.classList.add('active'); }
  else { bm.textContent = '☆ บันทึก'; bm.classList.remove('active'); }

  document.getElementById('qText').textContent = q.q;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${opt.key}.</span><span>${opt.text}</span>`;
    if (isAnswered) {
      btn.classList.add('disabled');
      if (opt.key === q.answer) btn.classList.add('correct');
      else if (opt.key === ans && ans !== q.answer) btn.classList.add('selected-wrong');
    } else {
      btn.addEventListener('click', () => answer(opt.key));
    }
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  const fbHeader = document.getElementById('fbHeader');
  if (isAnswered) {
    const correct = ans === q.answer;
    fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.className = `fb-header ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.textContent = correct ? '✓ ถูกต้อง!' : `✗ ไม่ถูกต้อง — คำตอบที่ถูกคือ ข้อ ${q.answer}`;
    document.getElementById('fbBody').textContent = q.explanation;
    document.getElementById('fbRef').innerHTML = `<strong>แหล่งอ้างอิง:</strong> ${q.ref}`;
  } else {
    fb.className = 'feedback';
  }

  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'สรุปผล' : 'ถัดไป →';
  updateSidebar();
}

function answer(key) { state.answered[current] = key; render(); }

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next > QUESTIONS.length - 1) {
    if (current === QUESTIONS.length - 1 && dir === 1) showSummary();
    return;
  }
  current = next; render();
}

function goToQuestion(idx) { current = idx; render(); }

function toggleBookmark() {
  if (state.bookmarks.has(current)) state.bookmarks.delete(current);
  else state.bookmarks.add(current);
  render();
}

function updateSidebar() {
  const answered = Object.keys(state.answered).length;
  const total = QUESTIONS.length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  document.getElementById('progressFill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progressLabel').textContent = `${answered} / ${total}`;
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = answered - correct;
  document.getElementById('scoreBookmark').textContent = state.bookmarks.size;
  const grid = document.getElementById('qNavGrid');
  grid.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'q-nav-btn';
    btn.textContent = q.id;
    if (idx === current) btn.classList.add('current');
    else if (state.answered[idx] !== undefined) {
      btn.classList.add(state.answered[idx] === QUESTIONS[idx].answer ? 'answered-correct' : 'answered-wrong');
    }
    if (state.bookmarks.has(idx)) btn.classList.add('bookmarked');
    btn.onclick = () => goToQuestion(idx);
    grid.appendChild(btn);
  });
}

function showSummary() {
  const total = QUESTIONS.length;
  const answered = Object.keys(state.answered).length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  const pct = answered > 0 ? Math.round((correct/answered)*100) : 0;
  alert(`สรุปผล\n\nตอบแล้ว: ${answered}/${total} ข้อ\nถูก: ${correct} ข้อ\nผิด: ${answered-correct} ข้อ\nคะแนน: ${pct}%`);
}

function toggleDark() {
  const dark = document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = dark ? '☀️ Light' : '🌙 Dark';
}

render();
</script>
</body>
</html>
