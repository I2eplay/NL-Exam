  {id:127,q:"127. ปัจจัยที่มีผลต่อลูกสุกรมีดังนี้ ข้อใดมีผลต่อการตายลูกสุกรมากที่สุด",opts:[{key:"1",text:"น้ำหนักแรกเกิด"},{key:"2",text:"อายุหย่านม"},{key:"3",text:"การย้ายฝาก"},{key:"4",text:"โรงเรือน"},{key:"5",text:"ลำดับท้อง"}],answer:"1",explanation:"น้ำหนักแรกเกิดต่ำ (<1 kg) เป็นปัจจัยเสี่ยงสูงสุดต่อการตายของลูกสุกร เนื่องจากมี thermoregulation ไม่ดี glycogen สำรองน้อย และดูดนมได้น้อยกว่า",ref:"Zimmerman JJ et al. Diseases of Swine. 10th ed. Wiley-Blackwell; 2012."},
  {id:128,q:"128. นักวิจัยต้องการตรวจสมมติฐานเกี่ยวกับระดับครีเอตินีนในประชากรสุนัขที่กินอาหารปรุงเองว่ามีค่ามากกว่า 2 mg/dl ข้อใดคือ Alternative hypothesis (mu คือค่าเฉลี่ยของประชากร)",opts:[{key:"1",text:"mu=2"},{key:"2",text:"mu<2"},{key:"3",text:"mu>2"},{key:"4",text:"mu<=2"},{key:"5",text:"mu>=2"}],answer:"3",explanation:"Alternative hypothesis (H1) คือสิ่งที่นักวิจัยต้องการพิสูจน์ ในกรณีนี้ต้องการพิสูจน์ว่า creatinine > 2 mg/dl จึงเป็น one-tailed test: H1: mu > 2",ref:"Petrie A, Watson P. Statistics for Veterinary and Animal Science. 3rd ed. Wiley-Blackwell; 2013."},
  {id:129,q:"129. การวิจัยเปรียบเทียบระดับน้ำตาลในเลือดของหนูทดลองที่ได้รับยาต่างกัน 4 กลุ่ม ข้อใดคือวิธีการทางสถิติที่จะเอามาใช้",opts:[{key:"1",text:"ANOVA"},{key:"2",text:"Paired t-test"},{key:"3",text:"Student's t-test"},{key:"4",text:"Chi-square test"},{key:"5",text:"Mann Whitney U test"}],answer:"1",explanation:"One-way ANOVA ใช้เปรียบเทียบค่าเฉลี่ยของตัวแปร continuous มากกว่า 2 กลุ่มขึ้นไป (ในที่นี้ 4 กลุ่ม) ถ้าใช้ t-test หลายครั้งจะเพิ่ม Type I error",ref:"Petrie A, Watson P. Statistics for Veterinary and Animal Science. 3rd ed. Wiley-Blackwell; 2013."},
  {id:130,q:"130. ปลานิล 4 เดือน เลี้ยงในกระชัง ว่ายน้ำแฉลบ เอาตัวถูกระชัง ควรตรวจวินิจฉัยด้วยวิธีใด",opts:[{key:"1",text:"ตรวจเลือด"},{key:"2",text:"ตรวจคุณภาพน้ำ"},{key:"3",text:"ตรวจอุจจาระ"},{key:"4",text:"ขูดตรวจเหงือก"},{key:"5",text:"ขูดตรวจผิวหนัง"}],answer:"5",explanation:"อาการว่ายแฉลบ เอาตัวถูบ่งชี้ ectoparasite บนผิวหนัง การ skin scraping และดูด้วยกล้องจุลทรรศน์เป็นวิธีวินิจฉัยที่เหมาะสม",ref:"Woo PTK. Fish Diseases and Disorders. Vol 1. 2nd ed. CABI; 2006."},
  {id:131,q:"131. สุนัข 5 ปี ถูกรถชนอย่างแรง ขาหน้าเหยียดเกร็ง ขาหลังอ่อนแรง ลุกยืนไม่ได้ แต่การรับรู้และตื่นตัวปกติ กระดูกสันหลังส่วนใดที่น่าจะเกิดความเสียหายและส่งผลให้เกิดอาการดังกล่าว",opts:[{key:"1",text:"C1-C5"},{key:"2",text:"C6-T2"},{key:"3",text:"T3-L3"},{key:"4",text:"L4-S3"},{key:"5",text:"Cd1-Cd5"}],answer:"3",explanation:"T3-L3 lesion ทำให้ UMN signs ขาหลัง (spastic paralysis, hyperreflexia) แต่ขาหน้าปกติ เพราะ บริเวณ C1-T2 ควบคุมขาหน้า ถ้าเสียที่ T3-L3 ขาหน้าปกติ ขาหลัง UMN",ref:"de Lahunta A, Glass E. Veterinary Neuroanatomy and Clinical Neurology. 3rd ed. Saunders; 2009."},
  {id:132,q:"132. สุนัขอายุ 5 ปี น้ำหนัก 15 kg มีก้อนเนื้องอกที่โพรงจมูก มีเลือดไหลออกโพรงจมูกด้านซ้าย ทำ cytology พบ round cells รักษาด้วยอะไร",opts:[{key:"1",text:"Vincristine"},{key:"2",text:"Vinblastine"},{key:"3",text:"Methotrexate"},{key:"4",text:"Cyclophosphamide"},{key:"5",text:"Cephalosporins"}],answer:"1",explanation:"Round cell tumor ในโพรงจมูก สงสัย lymphoma หรือ transmissible venereal tumor (TVT) TVT รักษาด้วย Vincristine เพียงอย่างเดียวมักได้ผลดี",ref:"Withrow SJ, Vail DM. Withrow & MacEwen's Small Animal Clinical Oncology. 4th ed. Saunders; 2007."},
  {id:133,q:"133. สุนัขเพศเมีย พันธุ์ผสม มีก้อนที่ด้านล่างท้อง cytology พบ round cells ที่มี cytoplasmic vacuoles คืออะไร",opts:[{key:"1",text:"Lymphoma"},{key:"2",text:"Histiocytoma"},{key:"3",text:"Mast cell tumor"},{key:"4",text:"Plasma cell tumor"},{key:"5",text:"Venereal tumor"}],answer:"3",explanation:"Mast cell tumor (MCT) cytology พบ round cells มี metachromatic granules ใน cytoplasm (purple/blue granules) หรือ vacuoles ถ้า degranulated เป็น tumor ที่พบบ่อยในสุนัข",ref:"Withrow SJ, Vail DM. Withrow & MacEwen's Small Animal Clinical Oncology. 4th ed. Saunders; 2007."},
  {id:134,q:"134. แมว 2 ปี เยื่อเมือกเหลือง มีไข้ ตรวจเลือดพบ hemolytic anemia ถามว่าให้ยาอะไร",opts:[{key:"1",text:"Doxycycline"},{key:"2",text:"Metronidazole"},{key:"3",text:"Diminazene"},{key:"4",text:"Melarsomine"},{key:"5",text:"Enrofloxacin"}],answer:"1",explanation:"Hemolytic anemia + ไข้ในแมว สงสัย Mycoplasma haemofelis (Haemobartonella) รักษาด้วย Doxycycline เป็น drug of choice",ref:"Greene CE. Infectious Diseases of the Dog and Cat. 4th ed. Saunders; 2012."},
  {id:135,q:"135. รกของหมูเป็นแบบใด",opts:[{key:"1",text:"Cotyledon"},{key:"2",text:"Discoidal"},{key:"3",text:"Diffuse"},{key:"4",text:"Zonary"}],answer:"3",explanation:"สุกรมี diffuse placenta (epitheliochorial) ซึ่ง chorionic villi กระจายทั่ว chorion สัมผัสกับ endometrium ทั้งหมด ไม่มีการรวมตัวเป็นบริเวณเฉพาะ",ref:"Hafez ESE, Hafez B. Reproduction in Farm Animals. 7th ed. Lippincott; 2000."},
  {id:136,q:"136. ให้ฟาร์มหนึ่งเลี้ยงแพะ แกะ โคร่วมกัน แม่โครีดนมมีไข้ซึม นมลด ตายมากกว่า 50% vasculitis, lymphocytic infiltration ต้องแก้ไขอย่างไร",opts:[{key:"1",text:"คัดทิ้งทั้งฟาร์ม"},{key:"2",text:"แยกเลี้ยง"},{key:"3",text:"ฉีดวัคซีน"},{key:"4",text:"แยกสัตว์อุ้มโรคกับสัตว์ไวต่อโรค"},{key:"5",text:"ให้ยาปฏิชีวนะ"}],answer:"4",explanation:"ลักษณะ vasculitis, lymphocytic infiltration, ตายสูง บ่งชี้ Small ruminant lentivirus (Maedi-Visna/CAE) ซึ่งไม่มียาหรือวัคซีน ต้องแยก seropositive ออกจาก seronegative",ref:"Radostits OM et al. Veterinary Medicine. 10th ed. Saunders; 2007."},
  {id:137,q:"137. โรงงานนมพาสเจอร์ไรส์แห่งหนึ่งผลิตนมตามมาตรฐานและเก็บรักษาผลิตภัณฑ์ไว้ที่อุณหภูมิ 4 องศาเซลเซียส หลังจากนั้น 24 ชั่วโมง สุ่มตรวจตัวอย่างพบนมเสีย แบคทีเรียตัวใดที่ทำให้นมเสียมากที่สุด",opts:[{key:"1",text:"Escherichia coli"},{key:"2",text:"Pseudomonas spp."},{key:"3",text:"Campylobacter spp."},{key:"4",text:"Mycobacterium bovis"},{key:"5",text:"Bacillus sterthermophillic"}],answer:"2",explanation:"Pseudomonas spp. เป็น psychrotrophic bacteria (เจริญได้ในอุณหภูมิต่ำ 4°C) ผลิต lipase และ protease ทำให้นมเสียที่อุณหภูมิตู้เย็น เป็นสาเหตุหลักของ refrigerated milk spoilage",ref:"Fox PF, McSweeney PLH. Advanced Dairy Chemistry. 3rd ed. Springer; 2003."},
  {id:138,q:"138. อุปกรณ์ต่อไปนี้มีไว้เพื่อป้องกันอะไร (อุปกรณ์ที่คาจมูกม้า)",opts:[{key:"1",text:"Biting"},{key:"2",text:"Weaving"},{key:"3",text:"Wind-sucking"},{key:"4",text:"Head-bobbing"},{key:"5",text:"Wood-chewing"}],answer:"3",explanation:"Crib-biting/wind-sucking collar หรืออุปกรณ์ที่คาบริเวณคอและจมูกม้า ออกแบบมาเพื่อป้องกัน cribbing (wind-sucking) พฤติกรรม stereotypy ที่ม้าจะงับขอบรางแล้วสูดอากาศเข้า",ref:"McGreevy PD. Equine Behavior. 2nd ed. Saunders; 2012."},
  {id:139,q:"139. ลูกม้า 6 เดือน เป็นอะไร (ขาหน้าโก่งออก)",opts:[{key:"1",text:"Physitis"},{key:"2",text:"Osteochondrosis"},{key:"3",text:"Septic arthritis"},{key:"4",text:"Flexural deformity"},{key:"5",text:"Angular limb deformity"}],answer:"1",explanation:"Physitis (epiphysitis) ในลูกม้าอายุ 4-8 เดือน พบบ่อยที่ distal radius growth plate อาการบวม ปวด ขาโก่ง เกิดจากการเจริญเติบโตเร็วเกินไปหรือโภชนาการไม่สมดุล",ref:"Auer JA, Stick JA. Equine Surgery. 4th ed. Elsevier; 2012."},
  {id:140,q:"140. ละมั่งถูกเคลื่อนย้าย หอบ ไข้ ตายหลังจากนั้น 6 ชม. เสริมอะไรเพื่อป้องกัน",opts:[{key:"1",text:"Cr"},{key:"2",text:"Fe"},{key:"3",text:"Ca"},{key:"4",text:"Mn"},{key:"5",text:"Se"}],answer:"5",explanation:"Capture myopathy ในสัตว์ป่า (ละมั่ง กวาง) เกิดจาก oxidative stress ในกล้ามเนื้อขณะ stress/exertion Selenium และ Vitamin E ป้องกัน white muscle disease และ capture myopathy",ref:"Fowler ME. Zoo and Wild Animal Medicine. 8th ed. Saunders; 2015."},
  {id:141,q:"141. ชิมแปนซี 3 ตัว อายุ 3, 5 และ 6 เดือน มีไข้ หอบ whooping cough ติดเชื้ออะไร",opts:[{key:"1",text:"Klebsiella pneumoniae"},{key:"2",text:"Bordetella pertussis"},{key:"3",text:"Streptococcus"},{key:"4",text:"Pasteurella multocida type A"},{key:"5",text:"APP"}],answer:"2",explanation:"Whooping cough (ไอกรน) ในไพรเมตรวมถึงชิมแปนซีเกิดจาก Bordetella pertussis เชื้อเดียวกับที่ทำให้เกิดโรคในเด็ก อาการ whooping cough เฉพาะเจาะจงมาก",ref:"Fowler ME. Zoo and Wild Animal Medicine. 8th ed. Saunders; 2015."},
  {id:142,q:"142. นกแก้ว macaw อายุ 3 ปี กินอาหารได้ปกติ เมื่อทำการ x-ray พบรอยโรคที่กระเพาะแท้ เกิดจากสาเหตุใด",opts:[{key:"1",text:"Bornavirus"},{key:"2",text:"Coronavirus"},{key:"3",text:"Herpes virus"},{key:"4",text:"Influenza virus"},{key:"5",text:"Adenovirus"}],answer:"1",explanation:"Proventricular Dilatation Disease (PDD) ในนกแก้ว เกิดจาก Avian Bornavirus (ABV) ทำลาย ganglia ใน proventriculus ทำให้กระเพาะขยายใหญ่ เห็นจาก x-ray",ref:"Rupley AE. Manual of Avian Practice. Saunders; 1997."},
  {id:143,q:"143. หลอดเลือดใดเหมาะสำหรับการกดเพื่อวัดชีพจรในม้า",opts:[{key:"1",text:"Linguofacial artery"},{key:"2",text:"External maxillary artery"},{key:"3",text:"Frontal artery"},{key:"4",text:"-"},{key:"5",text:"Facial/Transverse facial artery"}],answer:"5",explanation:"Facial artery หรือ transverse facial artery ในม้าสามารถคลำชีพจรได้ง่ายที่บริเวณหน้า เป็นตำแหน่งที่ใช้บ่อยในการวัด pulse rate ในม้า",ref:"Stashak TS. Adams' Lameness in Horses. 5th ed. Lippincott; 2002."},
  {id:144,q:"144. โคอายุ 1 ปี ซึม เบื่ออาหาร น้ำหนักลด ซักประวัติพบว่า 1 เดือนก่อน คนงานภายในฟาร์มมีอาการไข้ต่ำ ไอแห้ง หายใจหอบ วิธีการใดเป็นการวินิจฉัยเบื้องต้น",opts:[{key:"1",text:"Direct smear"},{key:"2",text:"PCR"},{key:"3",text:"Single intradermal test"},{key:"4",text:"Viral isolation"}],answer:"3",explanation:"อาการในโคและ zoonotic ในคนงาน (ไข้ต่ำ ไอแห้ง) บ่งชี้ Bovine tuberculosis (Mycobacterium bovis) การวินิจฉัยเบื้องต้นใช้ Single Intradermal Tuberculin Test (SITT)",ref:"OIE. Terrestrial Manual. Chapter on Bovine Tuberculosis. 2021."},
  {id:145,q:"145. หมาทำหัตถการดังภาพ ใช้อะไรเป็น wire passer",opts:[{key:"1",text:"Surgical needle"},{key:"2",text:"Hypodermal needle"},{key:"3",text:"Nasolacrimal Cannula"},{key:"4",text:"Foley catheter"},{key:"5",text:"Drill guide"}],answer:"2",explanation:"Hypodermic needle ใช้เป็น wire passer ในการผ่าตัดกระดูก โดยสอดผ่าน soft tissue เพื่อนำ cerclage wire ผ่านออกมา เป็น simple และ cost-effective technique",ref:"Fossum TW. Small Animal Surgery. 5th ed. Elsevier; 2019."},
  {id:146,q:"146. แม่วัว อายุ 5 ปี ท้องเสีย AST ALT สูง ตรวจอุจจาระเจอไข่พยาธิมี operculum จำนวนมาก ใช้ยาอะไรรักษา",opts:[{key:"1",text:"Levamisole"},{key:"2",text:"Pyrantel"},{key:"3",text:"Closulon (Cosulon)"},{key:"4",text:"Ivermectin"}],answer:"3",explanation:"ไข่พยาธิมี operculum บ่งชี้พยาธิใบไม้ตับ (Fasciola hepatica) AST ALT สูงยืนยัน liver involvement Closulon (clorsulon) เป็นยาเฉพาะสำหรับ fasciolosis ในโค",ref:"Radostits OM et al. Veterinary Medicine. 10th ed. Saunders; 2007."},
  {id:147,q:"147. แม่วัวคลอด ไม่เป็นสัดมา 2 เดือน รังไขเรียบ เล็กน้อยกว่า 1 cm เป็นไร",opts:[{key:"1",text:"Ovary inactive"},{key:"2",text:"Pyometra"},{key:"3",text:"Persistence CL"},{key:"4",text:"Pregnancy"}],answer:"1",explanation:"Ovary inactive (anestrus) รังไขเล็ก เรียบ ไม่มี follicle หรือ CL คลำได้ พบหลังคลอดในโคที่ negative energy balance หรือได้รับอาหารไม่เพียงพอ",ref:"Hafez ESE, Hafez B. Reproduction in Farm Animals. 7th ed. Lippincott; 2000."},
  {id:148,q:"148. หมูไอ จากช่องท้อง % ตายต่ำ ตัวเล็กแคระแกร็น ฉีดวัคซีนอะไรเพื่อแก้ปัญหา",opts:[{key:"1",text:"วัคซีน PRRS"},{key:"2",text:"วัคซีน Mycoplasma"},{key:"3",text:"ฉีดวัคซีนปอดอักเสบ"}],answer:"2",explanation:"ไอเรื้อรัง ตายต่ำ แคระแกร็น บ่งชี้ Mycoplasma hyopneumoniae (Enzootic pneumonia) วัคซีน Mycoplasma ป้องกันโรคและลด respiratory lesion",ref:"Zimmerman JJ et al. Diseases of Swine. 10th ed. Wiley-Blackwell; 2012."},
  {id:149,q:"149. ให้รูปไข่ Dipylidium caninum มา ถามว่าควรป้องกันอะไร",opts:[{key:"1",text:"หมัด"},{key:"2",text:"ไร"},{key:"3",text:"เห็บ"}],answer:"1",explanation:"Dipylidium caninum (cucumber tapeworm) ใช้หมัด (Ctenocephalides spp.) เป็น intermediate host ป้องกันโดยกำจัดหมัด ไม่มียาถ่ายพยาธิที่ได้ผลถ้าไม่กำจัดหมัด",ref:"Bowman DD. Georgis' Parasitology for Veterinarians. 10th ed. Saunders; 2014."},
  {id:150,q:"150. เจ้าของไม่พาหมาไปฉีดวัคซีนโดยให้เหตุผลว่าเลี้ยงแต่ในบ้าน ผิดสวัสดิภาพข้อใด",opts:[{key:"1",text:"Fear distress"},{key:"2",text:"Pain and disease"},{key:"3",text:"Normal behavior"},{key:"4",text:"Hungry & thirst"}],answer:"2",explanation:"การไม่ฉีดวัคซีนทำให้สัตว์เสี่ยงต่อโรคที่ป้องกันได้ ละเมิด Freedom from pain, injury and disease ซึ่งรวมถึงการป้องกันโรคด้วยวัคซีน",ref:"FAWC. Farm Animal Welfare Council Report. 1979."}

const imageMap = {
  2: "/NL-Exam/images/2022/sec2/q2.png",
  14: "/NL-Exam/images/2022/sec2/q14.png",
  17: "/NL-Exam/images/2022/sec2/q17.png",
  34: "/NL-Exam/images/2022/sec2/q34.jpeg",
  49: "/NL-Exam/images/2022/sec2/q49.png",
  51: "/NL-Exam/images/2022/sec2/q51.png", 
  82: "/NL-Exam/images/2022/sec2/q82.png",
  93: "/NL-Exam/images/2022/sec2/q93.png",
  107: "/NL-Exam/images/2022/sec2/q107.png",
  127: "/NL-Exam/images/2022/sec2/q127.png",
  132: "/NL-Exam/images/2022/sec2/q132.png",
  133: "/NL-Exam/images/2022/sec2/q133.png", 
  134: "/NL-Exam/images/2022/sec2/q134.png",
  138: "/NL-Exam/images/2022/sec2/q138.png",
  139: "/NL-Exam/images/2022/sec2/q139.png",
  145: "/NL-Exam/images/2022/sec2/q145.png", 
};

QUESTIONS.forEach((q) => {
  if (imageMap[q.id]) q.img = imageMap[q.id];
});

let current = 0;
const state = { answered: {}, bookmarks: new Set() };

function render() {
  const q = QUESTIONS[current];
  const ans = state.answered[current];
  const isAnswered = ans !== undefined;

  document.getElementById('qNumBadge').textContent = `ข้อ ${q.id}`;
  const bm = document.getElementById('bookmarkBtn');
  if (state.bookmarks.has(current)) { bm.textContent = '★ บันทึกแล้ว'; bm.classList.add('active'); }
  else { bm.textContent = '☆ บันทึก'; bm.classList.remove('active'); }

  document.getElementById('qText').textContent = q.q;
  const imgEl = document.getElementById('qImgContainer');
if (q.img) {
  imgEl.innerHTML = `<img src="${q.img}" style="max-width:100%;border-radius:8px;margin-bottom:16px;border:0.5px solid var(--border);">`;
} else {
  imgEl.innerHTML = '';
}

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${opt.key}.</span><span>${opt.text}</span>`;
    if (isAnswered) {
      btn.classList.add('disabled');
      if (opt.key === q.answer) btn.classList.add('correct');
      else if (opt.key === ans && ans !== q.answer) btn.classList.add('selected-wrong');
    } else {
      btn.addEventListener('click', () => answer(opt.key));
    }
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  const fbHeader = document.getElementById('fbHeader');
  if (isAnswered) {
    const correct = ans === q.answer;
    fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.className = `fb-header ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.textContent = correct ? '✓ ถูกต้อง!' : `✗ ไม่ถูกต้อง — คำตอบที่ถูกคือ ข้อ ${q.answer}`;
    document.getElementById('fbBody').textContent = q.explanation;
    document.getElementById('fbRef').innerHTML = `<strong>แหล่งอ้างอิง:</strong> ${q.ref}`;
  } else {
    fb.className = 'feedback';
  }

  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'สรุปผล' : 'ถัดไป →';
  updateSidebar();
}

function answer(key) { state.answered[current] = key; render(); }

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next > QUESTIONS.length - 1) {
    if (current === QUESTIONS.length - 1 && dir === 1) showSummary();
    return;
  }
  current = next; render();
}

function goToQuestion(idx) { current = idx; render(); }

function toggleBookmark() {
  if (state.bookmarks.has(current)) state.bookmarks.delete(current);
  else state.bookmarks.add(current);
  render();
}

function updateSidebar() {
  const answered = Object.keys(state.answered).length;
  const total = QUESTIONS.length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  document.getElementById('progressFill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progressLabel').textContent = `${answered} / ${total}`;
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = answered - correct;
  document.getElementById('scoreBookmark').textContent = state.bookmarks.size;
  const grid = document.getElementById('qNavGrid');
  grid.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'q-nav-btn';
    btn.textContent = q.id;
    if (idx === current) btn.classList.add('current');
    else if (state.answered[idx] !== undefined) {
      btn.classList.add(state.answered[idx] === QUESTIONS[idx].answer ? 'answered-correct' : 'answered-wrong');
    }
    if (state.bookmarks.has(idx)) btn.classList.add('bookmarked');
    btn.onclick = () => goToQuestion(idx);
    grid.appendChild(btn);
  });
}

function showSummary() {
  const total = QUESTIONS.length;
  const answered = Object.keys(state.answered).length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  const pct = answered > 0 ? Math.round((correct/answered)*100) : 0;
  document.getElementById('sumAnswered').textContent = `${answered} / ${total} ข้อ`;
  document.getElementById('sumCorrect').textContent = `${correct} ข้อ`;
  document.getElementById('sumWrong').textContent = `${answered - correct} ข้อ`;
  document.getElementById('sumPct').textContent = `${pct}%`;
  document.getElementById('summaryOverlay').classList.add('show');
}

function toggleDark() {
  const dark = document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = dark ? '☀️ Light' : '🌙 Dark';
}

render();
</script>
