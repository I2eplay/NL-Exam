  {id:124,q:"124. เจ้าของเพิ่งซื้อลูกสุนัขอายุ 2 เดือนมาจากตลาด BCS 3/5 สุนัขแสดงอาการจมูกแห้ง ขี้ตาเกรอะกรัง ผิวหนังมีรังแคและปรสิตภายนอกที่มองเห็นได้ด้วยตาเปล่า ขนโคนหางและก้นพบมูลเปียกแฉะ รอบรูทวารแดง เจ้าของต้องการฉีดวัคซีนให้ลูกสุนัขวันนี้ สัตวแพทย์จะให้คำแนะนำอย่างไร",opts:[{key:"1",text:"ยังไม่ควรฉีดวัคซีนใดๆ"},{key:"2",text:"ฉีดวัคซีนไข้หัดสุนัข"},{key:"3",text:"ฉีดวัคซีนพิษสุนัขบา"},{key:"4",text:"ฉีดวัคซีนลำไส้อักเสบติดต่อ"},{key:"5",text:"ฉีดวัคซีน infectious tracheobronchitis"}],answer:"1",explanation:"สุนัขที่ป่วย มีปรสิตภายนอก ผิดปกติหลายอย่าง ระบบภูมิคุ้มกันอ่อนแอ ไม่ควรฉีดวัคซีนทันที เพราะวัคซีนจะไม่ได้ผล และอาจทำให้อาการแย่ลง ต้องรักษาให้แข็งแรงก่อนแล้วค่อยฉีดวัคซีน",ref:"Ettinger SJ. Textbook of Veterinary Internal Medicine. 8th ed. Elsevier; 2017."},
  {id:125,q:"125. จับบังคับกวางเพื่อติดเครื่องสำรวจติดตาม หลังดำเนินการแล้วพบว่ากวางไม่สามารถลุกยืนได้ สัตวแพทย์ควรตรวจค่าเคมีในเลือดใดเพื่อวินิจฉัยอาการดังกล่าว",opts:[{key:"1",text:"Creatine kinase"},{key:"2",text:"Lactate dehydrogenase"},{key:"3",text:"Alanine aminotransferase"},{key:"4",text:"Gamma glutamyltransferase"},{key:"5",text:"Aspartate aminotransferase"}],answer:"1",explanation:"Creatine kinase (CK) เป็น enzyme ที่จำเพาะที่สุดสำหรับ muscle damage ในสัตว์ป่าที่ capture myopathy กวางที่ไม่สามารถลุกได้หลัง capture บ่งชี้ exertional myopathy, CK จะสูงขึ้นอย่างชัดเจน",ref:"Kreeger TJ, Arnemo JM. Handbook of Wildlife Chemical Immobilization. 4th ed. 2012."},
  {id:126,q:"126. สุกรมีอาการซึม มีแผลสะเก็ดสีน้ำตาลแกมดำ รูปสี่เหลี่ยมข้าวหลามตัด ขนาด 3-5 ซม. กระจายทั่วตัว",opts:[{key:"1",text:"ไม่อนุญาตให้เข้าฆ่า"},{key:"2",text:"อนุญาตให้เข้าฆ่าปกติ"},{key:"3",text:"อนุญาตให้เข้าฆ่าแบบฉุกเฉิน"},{key:"4",text:"อนุญาตให้เข้าฆ่าลำดับสุดท้าย"},{key:"5",text:"อนุญาตให้เข้าฆ่าปกติแต่ตัดชิ้นส่วนที่เป็นแผลออก"}],answer:"1",explanation:"สุกรที่มีรอยโรคผิวหนังรูปเพชร (diamond skin) บ่งชี้ Erysipelas เฉียบพลัน ซึ่งเป็น septicemic disease ต้องไม่อนุญาตให้เข้าฆ่า เพราะเนื้ออาจปนเปื้อนเชื้อทั่วซาก",ref:"Gracey JF et al. Meat Hygiene. 10th ed. Saunders; 1999."},
  {id:127,q:"127. ทำการุณยฆาตปลาขนาด 5 นิ้ว จำนวน 100 ตัว หลังจากทำงานวิจัยตามหลักสวัสดิภาพสัตว์",opts:[{key:"1",text:"Formalin"},{key:"2",text:"Ethyl alcohol"},{key:"3",text:"Isoflurane"},{key:"4",text:"Carbon dioxide"},{key:"5",text:"Tricaine methanesulfonate"}],answer:"5",explanation:"Tricaine methanesulfonate (MS-222) เป็นสารที่ AVMA แนะนำให้ใช้ euthanize ปลาตามหลักสวัสดิภาพสัตว์ (humane euthanasia) ทำให้สัตว์หมดสติก่อนตายโดยไม่เจ็บปวด",ref:"AVMA Guidelines for the Euthanasia of Animals. 2020."},
  {id:128,q:"128. สุนัขโดนรถชน เกร็งท้อง ไม่ขับถ่ายปัสสาวะมา 8 ชั่วโมง ถ่ายรังสีแบบไหน",opts:[{key:"1",text:"Negative contrast ionic iodine with room air"},{key:"2",text:"Positive contrast ionic iodine contrast with room air"},{key:"3",text:"Positive contrast non-ionic iodine contrast with room air"},{key:"4",text:"Double contrast ionic iodine contrast with room air"},{key:"5",text:"Double contrast non-ionic iodine contrast with room air"}],answer:"3",explanation:"ถ้าสงสัย bladder rupture ต้องตรวจ cystography ด้วย positive contrast non-ionic iodine contrast ถ้ามี perforation จะเห็น contrast รั่วออกสู่ช่องท้อง Non-ionic ปลอดภัยกว่า ionic ถ้ามี leakage เข้า peritoneum",ref:"Thrall DE. Textbook of Veterinary Diagnostic Radiology. 7th ed. Elsevier; 2017."},
  {id:129,q:"129. วัวคลอดยาก และได้ทำการช่วยคลอดแล้ว ผ่านไป 3 วัน เห็นรกหอยออกมาแต่ยังไม่ขาด สัตวแพทย์ควรแนะนำเจ้าของให้ปฏิบัติอย่างไร",opts:[{key:"1",text:"เอามือล้วงปลด"},{key:"2",text:"ล้างด้วยยาฆ่าเชื้อ"},{key:"3",text:"ป้อนยาปฏิชีวนะ"},{key:"4",text:"พอกด้วยน้ำตาลทราย"},{key:"5",text:"ตัดส่วนที่หอยออก โดยตัดให้เหลือสั้นที่สุด"}],answer:"5",explanation:"Retained placenta ใน 3 วัน ไม่ควรล้วงออกเพราะจะทำให้เลือดออกและบาดเจ็บ uterus ควรตัดส่วนที่หอยออกนอกให้สั้น เพื่อป้องกัน contamination และ weight pulling ส่วนที่ค้างจะหลุดเองตามธรรมชาติ",ref:"Noakes DE et al. Veterinary Reproduction and Obstetrics. 9th ed. Saunders; 2009."},
  {id:130,q:"130. แมวเพศผู้ปัสสาวะไม่ออก เคยสวนท่อปัสสาวะแล้วแต่สวนไม่เข้า ควรผ่าตัดแก้ไขอย่างไร",opts:[{key:"1",text:"Cystopexy"},{key:"2",text:"Cystotomy"},{key:"3",text:"Scrotal urethrostomy"},{key:"4",text:"Perineal urethrostomy"}],answer:"4",explanation:"Perineal urethrostomy (PU) เป็นการผ่าตัดมาตรฐานในแมวเพศผู้ที่มี urethral obstruction ซ้ำๆ สวนไม่ได้ โดยเปิด urethra ที่ตำแหน่ง perineal ซึ่งกว้างกว่า penile urethra ป้องกัน recurrence",ref:"Fossum TW. Small Animal Surgery. 5th ed. Elsevier; 2018."},
  {id:131,q:"131. โคเดินกระเผลก ข้อ carpus บวมสองข้าง testis ซ้ายมีขนาดใหญ่กว่าข้างขวา ควรเก็บตัวอย่างใดในการส่งตรวจ",opts:[{key:"1",text:"Serum"},{key:"2",text:"Sperm/Semen"},{key:"3",text:"Urine"},{key:"4",text:"Synovial fluid"},{key:"5",text:"Testis cytology"}],answer:"1",explanation:"อาการ polyarthritis (ข้อบวมหลายข้อ) และ epididymitis/orchitis (testis โต) บ่งชี้ Brucellosis ต้องเก็บ serum เพื่อ serology (RBPT, SAT, CFT) ยืนยันการวินิจฉัย",ref:"OIE Brucellosis Manual. 2021."},
  {id:132,q:"132. ฟาร์มไก่แห่งหนึ่งมีไก่ 1000 ตัว เกิดโรคระบาด ป่วย 500 ตัว ตาย 250 ตัว case fatality rate เท่าไหร่",opts:[{key:"1",text:"2%"},{key:"2",text:"4%"},{key:"3",text:"25%"},{key:"4",text:"50%"},{key:"5",text:"75%"}],answer:"4",explanation:"Case Fatality Rate (CFR) = จำนวนที่ตาย / จำนวนที่ป่วย × 100 = 250/500 × 100 = 50% ต่างจาก Mortality rate = 250/1000 × 100 = 25%",ref:"Thrusfield M. Veterinary Epidemiology. 4th ed. Wiley-Blackwell; 2018."},
  {id:133,q:"133. ฟาร์มปลาแห่งหนึ่ง เลี้ยงปลาในบ่อดิน แสดงอาการฮุบอากาศหายใจในตอนบ่าย ควรวัดค่าอะไรเพื่อเป็นการวินิจฉัยภาวะนี้",opts:[{key:"1",text:"Alkalinity"},{key:"2",text:"Nitrite"},{key:"3",text:"Turbidity"},{key:"4",text:"Salinity"},{key:"5",text:"Dissolved oxygen"}],answer:"5",explanation:"ปลาฮุบอากาศที่ผิวน้ำในตอนบ่าย บ่งชี้ภาวะ DO (Dissolved Oxygen) ต่ำ เพราะ algae bloom ในตอนบ่ายเริ่ม respire มากกว่า photosynthesize ทำให้ O₂ ในน้ำลดลง",ref:"Boyd CE. Water Quality in Warmwater Fish Ponds. 1979."},
  {id:134,q:"134. แพะอายุ 2 เดือน ในฟาร์มหนึ่ง มีอาการซึม มีไข้ ท้องเสีย ขนหยาบ เยื่อเมือกซีด ถามว่าควรซักประวัติอะไรเพิ่มเติม",opts:[{key:"1",text:"การฉีดวัคซีน"},{key:"2",text:"การถ่ายพยาธิ"},{key:"3",text:"อาหาร"},{key:"4",text:"โรงเรือน"},{key:"5",text:"ปัญหาในการคลอด"}],answer:"2",explanation:"แพะอายุ 2 เดือน มีเยื่อเมือกซีด ท้องเสีย บ่งชี้ GI parasitism (Haemonchus contortus) เป็นสาเหตุที่น่าจะเป็นมากที่สุด ควรซักประวัติการถ่ายพยาธิว่าทำหรือเปล่า และครั้งล่าสุดเมื่อไหร่",ref:"Taylor MA et al. Veterinary Parasitology. 4th ed. Wiley-Blackwell; 2015."},
  {id:135,q:"135. ลูกวัว 1 เดือน สะดืออักเสบมีหนอง จับบังคับเพื่อทำหัตถการยังไง",opts:[{key:"1",text:"เข้าซองคางเรือ"},{key:"2",text:"มือเปล่า"},{key:"3",text:"เข้าซอง"},{key:"4",text:"มัดขา"},{key:"5",text:"คีมดึงจมูก"}],answer:"2",explanation:"ลูกวัวอายุ 1 เดือน ขนาดเล็ก สามารถจับบังคับด้วยมือเปล่า โดยอุ้มหรือกอดตัวไว้กับผนัง ไม่จำเป็นต้องใช้ซองหรืออุปกรณ์ขนาดใหญ่",ref:"Fubini SL, Ducharme NG. Farm Animal Surgery. 2nd ed. Saunders; 2017."},
  {id:136,q:"136. สุนัขเพศผู้อายุ 11 ปี สัตวแพทย์ตรวจพบก้อนเนื้อขนาดเส้นผ่านศูนย์กลาง 8 cm ที่บริเวณ elbow area เป็นเวลา 4 เดือน ถามว่าควรส่งตรวจต่อมน้ำเหลืองใด เพื่อดูการแพร่กระจายของก้อนเนื้อ",opts:[{key:"1",text:"Axillary lymph node"},{key:"2",text:"Parotid lymph node"},{key:"3",text:"Popliteal lymph node"},{key:"4",text:"Submandibular lymph node"},{key:"5",text:"Superficial inguinal lymph node"}],answer:"1",explanation:"Axillary lymph node เป็น regional lymph node ที่ drain บริเวณ forelimb และ thoracic wall รวมถึงบริเวณ elbow ถ้าก้อนเนื้อแพร่กระจาย lymph node นี้จะโตขึ้นก่อน",ref:"Fossum TW. Small Animal Surgery. 5th ed. Elsevier; 2018."},
  {id:137,q:"137. สุนัขพันธุ์ผสม อายุ 3 ปี มีบาดแผลบริเวณกระดูกสันหลังส่วนอก สัตวแพทย์จึงสงสัยว่าได้รับบาดเจ็บ ต้องทำการทดสอบใด",opts:[{key:"1",text:"Stretch reflex"},{key:"2",text:"Hopping reflex"},{key:"3",text:"Panniculus reflex"},{key:"4",text:"Withdrawal reflex"},{key:"5",text:"Wheelbarrowing reflex"}],answer:"3",explanation:"Panniculus reflex (cutaneous trunci reflex) ทดสอบโดยกระตุ้นผิวหนังสองข้าง สังเกตการหดตัวของ cutaneous trunci muscle ใช้ระบุระดับของ thoracic spinal cord lesion ได้แม่นยำ",ref:"Dewey CW, da Costa RC. Practical Guide to Canine and Feline Neurology. 3rd ed. 2016."},
  {id:138,q:"138. สุนัขพันธุ์ Golden Retriever มาด้วยอาการเจ็บขาหลัง Lameness grade II/V สัตวแพทย์ได้ทำการตรวจร่างกายเบื้องต้น พบ Ortolani + ทั้ง 2 ข้าง อะไรเป็นสาเหตุดังกล่าว",opts:[{key:"1",text:"Hip laxity"},{key:"2",text:"Hip fracture"},{key:"3",text:"Patellar luxation"},{key:"4",text:"Knee joint laxity"},{key:"5",text:"Cruciate ligament rupture"}],answer:"1",explanation:"Ortolani test positive บ่งชี้ hip laxity (ความหลวมของ hip joint) ซึ่งเป็น hallmark ของ Canine Hip Dysplasia (CHD) พบบ่อยใน Golden Retriever และ large breed dogs",ref:"Fossum TW. Small Animal Surgery. 5th ed. Elsevier; 2018."},
  {id:139,q:"139. ม้าแข่งได้รับบาดเจ็บ สัตวแพทย์ตรวจโดยการให้ม้าวิ่งเรียบบนพื้นแข็ง พบว่าม้ายกหัวเมื่อขาหน้าข้างขวาแตะพื้น โครงสร้างใดที่มีความผิดปกติ",opts:[{key:"1",text:"Right forelimb"},{key:"2",text:"Left forelimb"},{key:"3",text:"Right hind limb"},{key:"4",text:"Left hind limb"}],answer:"1",explanation:"ม้ายกหัวขึ้น (head nod) เมื่อขาที่เจ็บแตะพื้น เพราะต้องการลดน้ำหนักที่ขาข้างนั้น ถ้าหัวยกขึ้นเมื่อขาหน้าขวาแตะพื้น แสดงว่า Right forelimb เป็นขาที่เจ็บ",ref:"Stashak TS. Adams' Lameness in Horses. 5th ed."},
  {id:140,q:"140. โคเพศเมีย หลังคลอด 1 เดือน ป่วยมา 1 อาทิตย์ อุจจาระน้อย ท้องข้างซ้ายขยาย การวินิจฉัยข้อใดดีที่สุด",opts:[{key:"1",text:"Ping sound"},{key:"2",text:"Radiology"},{key:"3",text:"Ballottement Test"},{key:"4",text:"Rumen auscultation"}],answer:"1",explanation:"Ping sound (ฟัง auscultation ร่วมกับ percussion) เป็นวิธีมาตรฐานวินิจฉัย rumen tympany หรือ left displacement abomasum ในโค ท้องซ้ายขยาย + ping sound บ่งชี้ LDA",ref:"Fubini SL, Ducharme NG. Farm Animal Surgery. 2nd ed. Saunders; 2017."},
  {id:142,q:"142. แมวอ้าปากหายใจ เป็น pleural effusion ใช้ stethoscope ฟังจะได้ยินเสียงอะไร",opts:[{key:"1",text:"Dull"},{key:"2",text:"Wheeze"},{key:"3",text:"Rhonchi"},{key:"4",text:"Harsh"},{key:"5",text:"Crackle"}],answer:"1",explanation:"Pleural effusion ทำให้เสียงปอดเบา/ไม่ได้ยิน (dull/muffled) บริเวณที่มีน้ำ เพราะของเหลวส่งเสียงผ่านได้น้อยกว่าอากาศ และ lung consolidation ด้วย",ref:"Ettinger SJ. Textbook of Veterinary Internal Medicine. 8th ed. Elsevier; 2017."},
  {id:143,q:"143. วัวคลอดยากเนื่องจากช่องคลอดเล็ก ใช้วิธีใดแก้ไข",opts:[{key:"1",text:"Celiotomy"},{key:"2",text:"Caslick's method"},{key:"3",text:"Episiotomy"},{key:"4",text:"Episioplasty"},{key:"5",text:"Bühner's method"}],answer:"3",explanation:"Episiotomy คือการกรีดขยาย vulva/perineum เพื่อเพิ่มขนาดช่องคลอดในกรณีช่องคลอดเล็กทำให้คลอดยาก เป็นหัตถการฉุกเฉินในการช่วยคลอด",ref:"Noakes DE et al. Veterinary Reproduction and Obstetrics. 9th ed. Saunders; 2009."},
  {id:144,q:"144. แม่ม้าภายหลังออกกำลังกาย พบก้อนเนื้อสีแดงตรงบริเวณทวารหนัก ขนาดประมาณ 10 cm ข้อใดคือวิธีการเย็บที่เหมาะสมที่สุดในการแก้ปัญหาดังกล่าว",opts:[{key:"1",text:"Purse string"},{key:"2",text:"Overlapping"},{key:"3",text:"Ford interlocking"},{key:"4",text:"Near-far-far-near"},{key:"5",text:"Horizontal mattress"}],answer:"1",explanation:"Rectal prolapse ในม้าหลังออกกำลังกาย แก้ไขด้วยการ reduce แล้วใช้ Purse string suture รอบ anal sphincter ชั่วคราวเพื่อป้องกัน recurrence ขณะที่ edema ลดลง",ref:"Stashak TS. Adams' Lameness in Horses. 5th ed."},
  {id:145,q:"145. ข้อใดเป็นรัศมีพื้นที่ในการทำ ring vaccination ที่แนะนำเมื่อเกิดการระบาดของโรคปากเท้าเปื่อย",opts:[{key:"1",text:"5 km"},{key:"2",text:"10 km"},{key:"3",text:"15 km"},{key:"4",text:"20 km"},{key:"5",text:"25 km"}],answer:"1",explanation:"Ring vaccination สำหรับ FMD ทำในรัศมี 5 กม. รอบฝูงที่ระบาด เพื่อสร้าง immune barrier ป้องกันการแพร่กระจายเชื้อออกไป ตาม OIE guidelines",ref:"OIE Foot and Mouth Disease. Technical Disease Card. 2021."},
  {id:146,q:"146. ฟาร์มสุกรขุน 600 ตัว รับสุกรเลี้ยงอายุ 3 สัปดาห์สัปดาห์ละ 200 ตัว พบสุกรอายุ 12 สัปดาห์ผอม ซีด มีจุดเล็กๆ สีแดงกระจายทั่วร่างกาย ผ่าชันสูตรพบ generalized lymphadenopathy ส่งตรวจทางห้องปฏิบัติการพบ lymphoid depletion สัตวแพทย์จึงทำการฉีดวัคซีนป้องกันโรคดังกล่าวในลูกสุกร ข้อใดคือคำแนะนำที่เหมาะสมที่สุดในการป้องกันปัญหาดังกล่าวในอนาคต",opts:[{key:"1",text:"เลี้ยงสุกรแยกเพศ"},{key:"2",text:"ฉีดวัคซีนป้องกันปัญหาดังกล่าวในลูกสุกร"},{key:"3",text:"ฉีดยาปฏิชีวนะแบบออกฤทธิ์วงกว้างในสุกรก่อนรับเข้าฟาร์ม"},{key:"4",text:"รับสุกรแบบ all in/all out จากโรงเรือนเดียวกัน"},{key:"5",text:"มีการจัดขนาดของสุกรให้ใกล้เคียงก่อนเข้าโรงเรือน"}],answer:"2",explanation:"อาการ lymphoid depletion และ petechiae บ่งชี้ PRRS หรือ Porcine Circovirus type 2 (PCV2/PMWS) การฉีดวัคซีน PCV2 ในลูกสุกรเป็นมาตรการป้องกันที่มีประสิทธิภาพสูงสุด",ref:"Zimmerman JJ et al. Diseases of Swine. 10th ed. Wiley-Blackwell; 2012."},
  {id:147,q:"147. หมูแท้งทุกระยะ ตายแรกคลอดเยอะ ตายตอนท้อง 94 วัน ฟาร์มทำวัคซีน FMD, PARVO, etc. ยกเว้นวัคซีน PRRS ถามว่าเกิดจากโรคอะไร",opts:[{key:"1",text:"PRRS"},{key:"2",text:"PARVO"},{key:"3",text:"FMD"}],answer:"1",explanation:"PRRS (Porcine Reproductive and Respiratory Syndrome) ทำให้แม่สุกรแท้งทุกระยะ ตายแรกคลอดมาก ลูกตายใน 94 วัน ฟาร์มไม่ได้ทำวัคซีน PRRS จึงน่าจะเป็นสาเหตุ",ref:"Zimmerman JJ et al. Diseases of Swine. 10th ed. Wiley-Blackwell; 2012."},
  {id:148,q:"148. เดือนก่อนคลอดวัวมี BCS 4/5 จะเกิดปัญหาอะไรตามมาหลังคลอด",opts:[{key:"1",text:"Ketosis"},{key:"2",text:"Acidosis"},{key:"3",text:"Milk fever"}],answer:"1",explanation:"วัวที่มี BCS 4/5 ก่อนคลอด (overconditioned) มีความเสี่ยงสูงมากต่อ Ketosis หลังคลอด เพราะ dry matter intake ลดลงก่อนคลอดมากกว่าวัวที่มี BCS ปกติ ทำให้ negative energy balance รุนแรงหลังคลอด",ref:"Drackley JK. Biology of Dairy Cows During Transition Period. J Dairy Sci. 1999."},
  {id:149,q:"149. มาตรฐานวัตถุดิบอาหารสำหรับโค",opts:[{key:"1",text:"GAP"},{key:"2",text:"ISO 14000"},{key:"3",text:"GMP"},{key:"4",text:"HACCP"}],answer:"3",explanation:"GMP (Good Manufacturing Practice) เป็นมาตรฐานที่ใช้สำหรับการผลิตวัตถุดิบและอาหารสัตว์ เน้นกระบวนการผลิตที่ถูกสุขลักษณะ ส่วน HACCP ใช้สำหรับกระบวนการผลิตอาหารที่มีการวิเคราะห์อันตรายและ CCP",ref:"Codex Alimentarius Code of Practice on Good Animal Feeding. CAC/RCP 54-2004."}
]; 
const imageMap = {
  19: "./images/2022/sec3/q19.png”,
  31: "./images/2022/sec3/q31.png”,
  38: "./images/2022/sec3/q38.png”,
  43: "./images/2022/sec3/q43.png”,
  77: "./images/2022/sec3/q77.png”,
  84: "./images/2022/sec3/q84.png”, 
  103: "./images/2022/sec3/q103.png”,
  105: "./images/2022/sec3/q105.png”,
  119: "./images/2022/sec3/q119.png”,
};

QUESTIONS.forEach((q, i) => {
  if (imageMap[i + 1]) q.img = imageMap[i + 1];
});


let current = 0;
const state = { answered: {}, bookmarks: new Set() };

function render() {
  const q = QUESTIONS[current];
  const ans = state.answered[current];
  const isAnswered = ans !== undefined;
  document.getElementById('qNumBadge').textContent = `ข้อ ${q.id}`;
  const bm = document.getElementById('bookmarkBtn');
  if (state.bookmarks.has(current)) { bm.textContent = '★ บันทึกแล้ว'; bm.classList.add('active'); }
  else { bm.textContent = '☆ บันทึก'; bm.classList.remove('active'); }
  document.getElementById('qText').textContent = q.q;
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${opt.key}.</span><span>${opt.text}</span>`;
    if (isAnswered) {
      btn.classList.add('disabled');
      if (opt.key === q.answer) btn.classList.add('correct');
      else if (opt.key === ans && ans !== q.answer) btn.classList.add('selected-wrong');
    } else {
      btn.addEventListener('click', () => answer(opt.key));
    }
    container.appendChild(btn);
  });
  const fb = document.getElementById('feedback');
  const fbHeader = document.getElementById('fbHeader');
  if (isAnswered) {
    const correct = ans === q.answer;
    fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.className = `fb-header ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.textContent = correct ? '✓ ถูกต้อง!' : `✗ ไม่ถูกต้อง — คำตอบที่ถูกคือ ข้อ ${q.answer}`;
    document.getElementById('fbBody').textContent = q.explanation;
    document.getElementById('fbRef').innerHTML = `<strong>แหล่งอ้างอิง:</strong> ${q.ref}`;
  } else {
    fb.className = 'feedback';
  }
  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'สรุปผล' : 'ถัดไป →';
  updateSidebar();
}

function answer(key) { state.answered[current] = key; render(); }

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next > QUESTIONS.length - 1) {
    if (current === QUESTIONS.length - 1 && dir === 1) showSummary();
    return;
  }
  current = next; render();
}

function goToQuestion(idx) { current = idx; render(); }

function toggleBookmark() {
  if (state.bookmarks.has(current)) state.bookmarks.delete(current);
  else state.bookmarks.add(current);
  render();
}

function updateSidebar() {
  const answered = Object.keys(state.answered).length;
  const total = QUESTIONS.length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  document.getElementById('progressFill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progressLabel').textContent = `${answered} / ${total}`;
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = answered - correct;
  document.getElementById('scoreBookmark').textContent = state.bookmarks.size;
  const grid = document.getElementById('qNavGrid');
  grid.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'q-nav-btn';
    btn.textContent = q.id;
    if (idx === current) btn.classList.add('current');
    else if (state.answered[idx] !== undefined) {
      btn.classList.add(state.answered[idx] === QUESTIONS[idx].answer ? 'answered-correct' : 'answered-wrong');
    }
    if (state.bookmarks.has(idx)) btn.classList.add('bookmarked');
    btn.onclick = () => goToQuestion(idx);
    grid.appendChild(btn);
  });
}

function showSummary() {
  const total = QUESTIONS.length;
  const answered = Object.keys(state.answered).length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  const pct = answered > 0 ? Math.round((correct/answered)*100) : 0;
  alert(`สรุปผล\n\nตอบแล้ว: ${answered}/${total} ข้อ\nถูก: ${correct} ข้อ\nผิด: ${answered-correct} ข้อ\nคะแนน: ${pct}%`);
}

function toggleDark() {
  const dark = document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = dark ? '☀️ Light' : '🌙 Dark';
}

render();
</script>
