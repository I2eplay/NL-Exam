  {id:145,q:"145. จุลินทรีย์จัดเป็นอะไรของความเสี่ยงใน มกอช.",opts:[{key:"ก",text:"Risk"},{key:"ข",text:"Hazard"},{key:"ค",text:"Pathogen"},{key:"ง",text:"Variable"},{key:"จ",text:"Uncertainty"}],answer:"ข",explanation:"ในมาตรฐานด้านความปลอดภัยอาหาร (มกอช.) จุลินทรีย์ก่อโรคถือเป็น 'อันตราย' (Hazard) ทางชีวภาพ ซึ่งแตกต่างจาก Risk ที่หมายถึงโอกาสที่ hazard จะก่อให้เกิดอันตราย",ref:"Codex Alimentarius. General Principles of Food Hygiene. CAC/RCP 1-1969."},
  {id:146,q:"146. กล้ามเนื้อที่จะพบเมื่อทำการ Ventral laparotomy ทางด้าน paramedian คือกล้ามเนื้อใด",opts:[{key:"ก",text:"Transverse abdominal"},{key:"ข",text:"External abdominal oblique"},{key:"ค",text:"Internal abdominal oblique"},{key:"ง",text:"Linea alba"},{key:"จ",text:"Rectus abdominis"}],answer:"จ",explanation:"เมื่อผ่าตัดเข้าช่องท้องแบบ Paramedian (ข้างแนวกึ่งกลางลำตัว) จะต้องผ่านกล้ามเนื้อ Rectus abdominis เป็นหลัก",ref:"Dyce KM et al. Textbook of Veterinary Anatomy. 4th ed. Saunders; 2010."},
  {id:147,q:"147. ภาพถ่ายรังสีที่จะพบเมื่อม้าเป็นโรคไข้ลงกีบเรื้อรัง (Chronic laminitis) จะมีลักษณะแบบใด",opts:[{key:"ก",text:"Dorsal pedal bone ขนานกับ Hoof wall"},{key:"ข",text:"Dorsal pedal bone ขนานกับ Sole surface"},{key:"ค",text:"Extensor tendon อยู่เท่ากับ Coronary band"},{key:"ง",text:"Extensor tendon อยู่สูงกว่า Coronary band"},{key:"จ",text:"Dorsal pedal bone กับ hoof wall มีช่องว่างระหว่างด้านบนน้อยกว่าช่องระหว่างขอบด้านล่าง"}],answer:"จ",explanation:"รอยโรคคลาสสิกของ Chronic laminitis คือการเกิดการหมุนตัว (Rotation) ของกระดูก P3 ทำให้ส่วนปลายทิ่มลง ทำให้ช่องว่างบนน้อยกว่าด้านล่าง",ref:"Ross MW, Dyson SJ. Lameness in the Horse. 2nd ed. Saunders; 2011."},
  {id:148,q:"148. วัวรุ่น 20 ตัว เลี้ยงแบบปล่อย มีปัญหา Body condition score ต่ำ (1.5-3.5) ทั้งที่ขับถ่ายและเคี้ยวเอื้องปกติ คาดว่าปัญหาเกิดจากสาเหตุใด",opts:[{key:"ก",text:"ได้รับอาหารข้นน้อยเกินไป"},{key:"ข",text:"ได้รับอาหารข้นมากเกินไป"},{key:"ค",text:"ได้อาหารหยาบน้อยเกินไป"},{key:"ง",text:"มีการต่อสู้แย่งอาหารกัน"},{key:"จ",text:"ความถี่ในการให้อาหาร"}],answer:"ง",explanation:"วัวรุ่นเลี้ยงปล่อย มีการเคี้ยวเอื้องและขับถ่ายปกติแต่ร่างกายซูบผอม มักเกิดจากปัญหาพฤติกรรมการจัดการฝูง ที่สัตว์อันดับต่ำ (Subordinate) ถูกแย่งอาหาร",ref:"Constable PD et al. Veterinary Medicine. 11th ed. Saunders; 2016."},
  {id:149,q:"149. ถ้าต้องการตรวจค่าปริมาณรังสีที่ปล่อยออกมาในห้องเอ็กซเรย์ที่คนทำงานจะได้รับ ควรขอใช้เครื่องตรวจจากหน่วยงานใด",opts:[{key:"ก",text:"กรมปศุสัตว์"},{key:"ข",text:"กรมวิทยาศาสตร์การแพทย์ กระทรวงสาธารณสุข"},{key:"ค",text:"สำนักงานเขต เทศบาล และ อบต."},{key:"ง",text:"สำนักงานปรมาณูเพื่อสันติ"},{key:"จ",text:"กระทรวงอุตสาหกรรม"}],answer:"ข",explanation:"กองรังสีและเครื่องมือแพทย์ กรมวิทยาศาสตร์การแพทย์ กระทรวงสาธารณสุข ให้บริการประเมินปริมาณรังสีประจำบุคคลสำหรับผู้ทำงานกับรังสีในสถานพยาบาล",ref:"กรมวิทยาศาสตร์การแพทย์. คู่มือแนวทางการให้บริการประเมินปริมาณรังสีประจำบุคคล."},
  {id:150,q:"150. ต้องการตรวจระบบโครงสร้าง (สะโพก) ในสุนัขพันธุ์ German Shepherd อายุ 1 ปี ควรเลือกใช้การตรวจวิธีใด",opts:[{key:"ก",text:"Elbow flexion"},{key:"ข",text:"Ortolani test"},{key:"ค",text:"Drawer test"},{key:"ง",text:"Tibial compression test"},{key:"จ",text:"Shoulder abduction"}],answer:"ข",explanation:"Ortolani test เป็นการทดสอบมาตรฐานสำหรับวินิจฉัย Hip dysplasia ในสุนัข โดยการดึงขาและ abduct เพื่อฟังเสียง 'click' เมื่อ femoral head กลับเข้า acetabulum",ref:"Brinker, Piermattei and Flo's Handbook of Small Animal Orthopedics. 5th ed. Elsevier; 2016."}
]; 
const imageMap = {
  23: "./images/2021/sec3/q23.png”,
  51: "./images/2021/sec3/q51.png”,
  52: "./images/2021/sec3/q52.png”,
  66: "./images/2021/sec3/q66.png”,
  100: "./images/2021/sec3/q100.png”,
  112: "./images/2021/sec3/q112.png”, 
};

QUESTIONS.forEach((q, i) => {
  if (imageMap[i + 1]) q.img = imageMap[i + 1];
});


let current = 0;
const state = {answered:{}, bookmarks:new Set()};

function render() {
  const q = QUESTIONS[current];
  const ans = state.answered[current];
  const isAnswered = ans !== undefined;
  document.getElementById('qNumBadge').textContent = `ข้อ ${q.id}`;
  const bm = document.getElementById('bookmarkBtn');
  if (state.bookmarks.has(current)) {bm.textContent='★ บันทึกแล้ว';bm.classList.add('active');}
  else {bm.textContent='☆ บันทึก';bm.classList.remove('active');}
  document.getElementById('qText').textContent = q.q;
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${opt.key}.</span><span>${opt.text}</span>`;
    if (isAnswered) {
      btn.classList.add('disabled');
      if (opt.key === q.answer) btn.classList.add('correct');
      else if (opt.key === ans && ans !== q.answer) btn.classList.add('selected-wrong');
    } else {
      btn.addEventListener('click', () => answer(opt.key));
    }
    container.appendChild(btn);
  });
  const fb = document.getElementById('feedback');
  const fbHeader = document.getElementById('fbHeader');
  if (isAnswered) {
    const correct = ans === q.answer;
    fb.className = `feedback show ${correct?'correct-fb':'wrong-fb'}`;
    fbHeader.className = `fb-header ${correct?'correct-fb':'wrong-fb'}`;
    fbHeader.textContent = correct ? '✓ ถูกต้อง!' : `✗ ไม่ถูกต้อง — คำตอบที่ถูกคือ ข้อ ${q.answer}`;
    document.getElementById('fbBody').textContent = q.explanation;
    document.getElementById('fbRef').innerHTML = `<strong>แหล่งอ้างอิง:</strong> ${q.ref}`;
  } else {
    fb.className = 'feedback';
  }
  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === QUESTIONS.length-1 ? 'สรุปผล' : 'ถัดไป →';
  updateSidebar();
}

function answer(key) {state.answered[current]=key;render();}

function navigate(dir) {
  const next = current+dir;
  if (next<0||next>QUESTIONS.length-1) {
    if (current===QUESTIONS.length-1&&dir===1) showSummary();
    return;
  }
  current=next;render();
}

function goToQuestion(idx){current=idx;render();}

function toggleBookmark(){
  if(state.bookmarks.has(current))state.bookmarks.delete(current);
  else state.bookmarks.add(current);
  render();
}

function updateSidebar(){
  const answered=Object.keys(state.answered).length;
  const total=QUESTIONS.length;
  const correct=Object.entries(state.answered).filter(([i,k])=>k===QUESTIONS[i].answer).length;
  document.getElementById('progressFill').style.width=`${(answered/total)*100}%`;
  document.getElementById('progressLabel').textContent=`${answered} / ${total}`;
  document.getElementById('scoreCorrect').textContent=correct;
  document.getElementById('scoreWrong').textContent=answered-correct;
  document.getElementById('scoreBookmark').textContent=state.bookmarks.size;
  const grid=document.getElementById('qNavGrid');
  grid.innerHTML='';
  QUESTIONS.forEach((q,idx)=>{
    const btn=document.createElement('button');
    btn.className='q-nav-btn';
    btn.textContent=q.id;
    if(idx===current)btn.classList.add('current');
    else if(state.answered[idx]!==undefined){
      btn.classList.add(state.answered[idx]===QUESTIONS[idx].answer?'answered-correct':'answered-wrong');
    }
    if(state.bookmarks.has(idx))btn.classList.add('bookmarked');
    btn.onclick=()=>goToQuestion(idx);
    grid.appendChild(btn);
  });
}

function showSummary(){
  const total=QUESTIONS.length;
  const answered=Object.keys(state.answered).length;
  const correct=Object.entries(state.answered).filter(([i,k])=>k===QUESTIONS[i].answer).length;
  const pct=answered>0?Math.round((correct/answered)*100):0;
  document.getElementById('sumScore').textContent=`${correct}/${total}`;
  document.getElementById('sumPct').textContent=`${pct}% ถูกต้อง`;
  document.getElementById('sumCorrect').textContent=correct;
  document.getElementById('sumWrong').textContent=answered-correct;
  document.getElementById('summaryOverlay').classList.add('show');
}

function closeSummary(){
  document.getElementById('summaryOverlay').classList.remove('show');
  current=0;render();
}

function toggleDark(){
  const dark=document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent=dark?'☀️ Light':'🌙 Dark';
}

render();
</script>
</body>
</html>
