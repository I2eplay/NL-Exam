  {id:132,q:"132. Lateral view พบ bulging caudodorsal border และ caudal displacement of caudal lobe VD view พบ Cowboy leg จากผล X-ray หัวใจห้องไหนมีการโต",opts:[{key:"ก",text:"Left atrium"},{key:"ข",text:"Right atrium"},{key:"ค",text:"Left ventricle"},{key:"ง",text:"Right ventricle"}],answer:"ก",explanation:"Left atrium enlargement ทำให้ caudodorsal border ของหัวใจโป่งออก (lateral view) และดัน caudal lobes ลงทำให้ mainstem bronchi แยกออก (cowboy leg sign ใน VD view)",ref:"Thrall DE. Textbook of Veterinary Diagnostic Radiology. 6th ed. Saunders; 2013."},
  {id:133,q:"133. ข้อใดคือหลักการของการกักสัตว์ที่ต้องสงสัยเป็นโรคพิษสุนัขบา",opts:[{key:"ก",text:"Latent period"},{key:"ข",text:"Prodromal period"},{key:"ค",text:"Invasion period"},{key:"ง",text:"Infectious period"},{key:"จ",text:"Incubation period"}],answer:"จ",explanation:"การกักสัตว์สงสัยพิษสุนัขบา 10 วัน อิงตาม incubation period ของไวรัส ถ้าสัตว์ไม่ตายใน 10 วัน แสดงว่าไม่ได้อยู่ใน excretory phase ขณะกัด",ref:"Greene CE. Infectious Diseases of the Dog and Cat. 4th ed. Saunders; 2012."},
  {id:134,q:"134. สุนัขพันธุ์ชิสุ อายุ 8 เดือน มีภาวะ umbilical hernia แบบดันกลับได้และมี elastic ring เส้นผ่านศูนย์กลาง 1 เซนติเมตร ข้อใดคือวิธีแก้ไขปัญหาที่พบ",opts:[{key:"ก",text:"Celiotomy"},{key:"ข",text:"Castration"},{key:"ค",text:"Herniorrhaphy"},{key:"ง",text:"Ovariohysterectomy"},{key:"จ",text:"Conservative treatment"}],answer:"จ",explanation:"Umbilical hernia ขนาดเล็ก (1 cm) ที่ reducible และมี elastic ring ในลูกสุนัข มักหายเองได้เมื่ออายุมากขึ้น conservative treatment (เฝ้าสังเกต) เหมาะสมกว่าการผ่าตัด",ref:"Fossum TW. Small Animal Surgery. 4th ed. Mosby; 2013."},
  {id:135,q:"135. วัสดุเย็บข้อใดเหมาะกับการเย็บปิดปาดแผลปลาคาร์ฟ",opts:[{key:"ก",text:"Catgut"},{key:"ข",text:"Silk"},{key:"ค",text:"Nylon"},{key:"ง",text:"Polyglactin"},{key:"จ",text:"Poliglecaprone"}],answer:"ค",explanation:"Nylon (monofilament non-absorbable) เหมาะสำหรับเย็บผิวหนังปลา เพราะไม่ดูดซึมในสภาพแวดล้อมน้ำ มีความแข็งแรงพอเพียง และปลาสามารถถอดไหมออกได้ในภายหลัง",ref:"Stoskopf MK. Fish Medicine. W.B. Saunders; 1993."},
  {id:136,q:"136. ฉีดยาโคเนื้อตรงไหน ที่ทำให้คุณภาพซากเสียหายน้อยที่สุด",opts:[{key:"ก",text:"Gluteal muscle"},{key:"ข",text:"Quadriceps muscle"},{key:"ค",text:"Paralumbar muscle"},{key:"ง",text:"Hamstring"},{key:"จ",text:"Cervical muscle"}],answer:"จ",explanation:"ฉีดยาที่ Cervical muscle (คอ) เป็นบริเวณที่มีมูลค่าซากต่ำที่สุด ทำให้การเสียหายจาก injection site lesion กระทบน้ำหนักและคุณภาพซากน้อยที่สุด",ref:"Gracey JF et al. Meat Hygiene. 10th ed. Saunders; 1999."},
  {id:137,q:"137. จับบังคับม้าพื้นฐาน ข้อใดต้องทำอยู่เรื่อยๆ",opts:[{key:"ก",text:"ขลุม+เชือกจูง"},{key:"ข",text:"ไม้หมอบิดจมูก"},{key:"ค",text:"มือบิดผิวหนัง"},{key:"ง",text:"โซ่พาดเหงือก"},{key:"จ",text:"เชือกผูกจูง"}],answer:"ก",explanation:"ขลุม (halter) + เชือกจูง เป็นอุปกรณ์พื้นฐานที่ม้าต้องสวมและใช้ตลอดเวลาเพื่อควบคุมการเคลื่อนไหว การฝึกม้าใหม่ทุกตัวต้องเริ่มจากการใส่ขลุมและเดินนำด้วยเชือกจูง",ref:"Reed SM et al. Equine Internal Medicine. 3rd ed. Saunders; 2010."},
  {id:138,q:"138. ฟัง ileocecal valve ของม้า ฟังที่ตำแหน่งใด",opts:[{key:"ก",text:"Right paralumbar fossa"},{key:"ข",text:"Left paralumbar fossa"},{key:"ค",text:"Right lower abdomen"},{key:"ง",text:"Left lower abdomen"}],answer:"ก",explanation:"",ref:"Reed SM et al. Equine Internal Medicine. 3rd ed. Saunders; 2010."},
  {id:139,q:"139. แม่โคนมพันธุ์ Holstein Friesian 100% อายุ 6 ปี สัตวแพทย์พบว่ามีแผลฉีกขาดบริเวณหัวนม ต้องได้รับการศัลยกรรมแก้ไข ข้อใดเป็นวิธีบังคับโคที่เหมาะสมที่สุด",opts:[{key:"ก",text:"ล้มเชือก"},{key:"ข",text:"ฉีดยาซึม"},{key:"ค",text:"ฉีดยาสลบ"},{key:"ง",text:"ใช้ที่หนีบจมูก"},{key:"จ",text:"ใช้เชือกมัดขา"}],answer:"ข",explanation:"การผ่าตัดบริเวณหัวนมโคต้องการให้โคนิ่งเพียงพอ การฉีดยาซึม (xylazine IM/IV) เหมาะสมที่สุดเพราะโคจะสงบนิ่ง ยังยืนอยู่ได้ และสัตวแพทย์ทำงานได้สะดวก",ref:"Fubini SL, Ducharme NG. Farm Animal Surgery. 2nd ed. Saunders; 2017."},
  {id:140,q:"140. ข้อใดเป็นการระบุ signalment ของม้าเพศผู้มีอัณฑะ 2 ข้าง อายุ 5 ปี ลงในทะเบียนประวัติอย่างถูกต้อง",opts:[{key:"ก",text:"Colt"},{key:"ข",text:"Foal"},{key:"ค",text:"Mare"},{key:"ง",text:"Gelding"},{key:"จ",text:"Stallion"}],answer:"จ",explanation:"Stallion คือม้าเพศผู้ที่มีอัณฑะครบ (entire male) อายุมากกว่า 4 ปี, Colt = ม้าผู้อายุต่ำกว่า 4 ปี, Gelding = ม้าผู้ที่ตอนแล้ว, Mare = ม้าเพศเมีย, Foal = ลูกม้า",ref:"Reed SM et al. Equine Internal Medicine. 3rd ed. Saunders; 2010."},
  {id:141,q:"141. ข้อใดเป็นหลอดเลือดดำที่เหมาะสมที่สุดในการบริหารยา cephalexin เข้าทางหลอดเลือดในกระต่ายที่มี septicemia",opts:[{key:"ก",text:"Jugular vein"},{key:"ข",text:"Femoral vein"},{key:"ค",text:"Cephalic vein"},{key:"ง",text:"Auricular vein"},{key:"จ",text:"Median cubital vein"}],answer:"ง",explanation:"Auricular vein (หลอดเลือดดำที่หู) เป็นตำแหน่งมาตรฐานสำหรับ IV catheter ในกระต่าย เข้าถึงง่าย มองเห็นชัด และสะดวกสำหรับการให้ยาทางหลอดเลือดในกระต่าย",ref:"Quesenberry KE, Carpenter JW. Ferrets, Rabbits and Rodents. 3rd ed. Saunders; 2012."}
];

let current = 0;
const state = { answered: {}, bookmarks: new Set() };

function render() {
  const q = QUESTIONS[current];
  const ans = state.answered[current];
  const isAnswered = ans !== undefined;

  document.getElementById('qNumBadge').textContent = `ข้อ ${q.id}`;
  const bm = document.getElementById('bookmarkBtn');
  if (state.bookmarks.has(current)) { bm.textContent = '★ บันทึกแล้ว'; bm.classList.add('active'); }
  else { bm.textContent = '☆ บันทึก'; bm.classList.remove('active'); }

  document.getElementById('qText').textContent = q.q;
  const imgEl = document.getElementById('qImgContainer');
if (q.img) {
  imgEl.innerHTML = `<img src="${q.img}" style="max-width:100%;border-radius:8px;margin-bottom:16px;border:0.5px solid var(--border);">`;
} else {
  imgEl.innerHTML = '';
}

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${opt.key}.</span><span>${opt.text}</span>`;
    if (isAnswered) {
      btn.classList.add('disabled');
      if (opt.key === q.answer) btn.classList.add('correct');
      else if (opt.key === ans && ans !== q.answer) btn.classList.add('selected-wrong');
    } else {
      btn.addEventListener('click', () => answer(opt.key));
    }
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  const fbHeader = document.getElementById('fbHeader');
  if (isAnswered) {
    const correct = ans === q.answer;
    fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.className = `fb-header ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.textContent = correct ? '✓ ถูกต้อง!' : `✗ ไม่ถูกต้อง — คำตอบที่ถูกคือ ข้อ ${q.answer}`;
    document.getElementById('fbBody').textContent = q.explanation;
    document.getElementById('fbRef').innerHTML = `<strong>แหล่งอ้างอิง:</strong> ${q.ref}`;
  } else {
    fb.className = 'feedback';
  }

  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'สรุปผล' : 'ถัดไป →';
  updateSidebar();
}

function answer(key) { state.answered[current] = key; render(); }

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next > QUESTIONS.length - 1) {
    if (current === QUESTIONS.length - 1 && dir === 1) showSummary();
    return;
  }
  current = next; render();
}

function goToQuestion(idx) { current = idx; render(); }

function toggleBookmark() {
  if (state.bookmarks.has(current)) state.bookmarks.delete(current);
  else state.bookmarks.add(current);
  render();
}

function updateSidebar() {
  const answered = Object.keys(state.answered).length;
  const total = QUESTIONS.length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  document.getElementById('progressFill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progressLabel').textContent = `${answered} / ${total}`;
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = answered - correct;
  document.getElementById('scoreBookmark').textContent = state.bookmarks.size;
  const grid = document.getElementById('qNavGrid');
  grid.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'q-nav-btn';
    btn.textContent = q.id;
    if (idx === current) btn.classList.add('current');
    else if (state.answered[idx] !== undefined) {
      btn.classList.add(state.answered[idx] === QUESTIONS[idx].answer ? 'answered-correct' : 'answered-wrong');
    }
    if (state.bookmarks.has(idx)) btn.classList.add('bookmarked');
    btn.onclick = () => goToQuestion(idx);
    grid.appendChild(btn);
  });
}

function showSummary() {
  const total = QUESTIONS.length;
  const answered = Object.keys(state.answered).length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  const pct = answered > 0 ? Math.round((correct/answered)*100) : 0;
  alert(`สรุปผล\n\nตอบแล้ว: ${answered}/${total} ข้อ\nถูก: ${correct} ข้อ\nผิด: ${answered-correct} ข้อ\nคะแนน: ${pct}%`);
}

function toggleDark() {
  const dark = document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = dark ? '☀️ Light' : '🌙 Dark';
}

render();
</script>
