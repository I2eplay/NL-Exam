<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลัง NL — 2013 หมวด 3</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+Thai:wght@400;600;700&display=swap');

    *{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#f4f1eb;
      --surface:#ffffff;
      --surface2:#edeae2;
      --accent:#1a472a;
      --accent2:#2d6a4f;
      --accent-light:#d8f3dc;
      --gold:#a07208;
      --gold-light:#fef9ec;
      --text:#111111;
      --text2:#444440;
      --text3:#888880;
      --border:rgba(0,0,0,0.11);
      --border2:rgba(0,0,0,0.06);
      --shadow:0 1px 4px rgba(0,0,0,0.07);
      --correct:#1a472a;
      --correct-bg:#d8f3dc;
      --wrong:#991b1b;
      --wrong-bg:#fee2e2;
      --r:10px;
      --transition: color 0.25s, background 0.25s, border-color 0.25s;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Sarabun',sans-serif;
      min-height:100vh;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;transition:background 0.3s,border-color 0.3s}
    .hdr-left{display:flex;align-items:center;gap:10px}
    .back-btn{background:none;border:0.5px solid var(--border);border-radius:7px;padding:6px 12px;font-size:13px;font-family:'Sarabun',sans-serif;color:var(--text2);cursor:pointer;transition:background 0.15s;display:flex;align-items:center;gap:5px;font-weight:500}
    .back-btn:hover{background:var(--surface2)}
    .hdr-title{font-size:15px;font-weight:700;color:var(--accent);font-family:'Noto Serif Thai',serif}
    .hdr-sub{font-size:12px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-top:1px}
    .dark-btn{background:var(--surface);border:0.5px solid var(--border);border-radius:7px;padding:6px 14px;font-size:13px;font-family:'Sarabun',sans-serif;color:var(--text2);cursor:pointer;transition:background 0.15s;font-weight:500;display:flex;align-items:center;gap:6px}
    .dark-btn:hover{background:var(--surface2)}

    /* LAYOUT */
    .layout{display:grid;grid-template-columns:1fr 260px;gap:20px;max-width:1100px;margin:0 auto;padding:20px 16px;align-items:start}
    @media(max-width:768px){.layout{grid-template-columns:1fr}}
    .sidebar-panel{position:sticky;top:68px}
    @media(max-width:768px){.sidebar-panel{position:static;order:2}}

    /* QUESTION CARD */
    .q-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:24px 28px;box-shadow:var(--shadow);transition:background 0.3s,border-color 0.3s}
    .q-meta{display:flex;align-items:center;gap:8px;margin-bottom:16px}
    .q-num-badge{background:var(--accent);color:white;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
    .q-bookmark{background:none;border:0.5px solid var(--border);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--text3);transition:all 0.15s;font-family:'Sarabun',sans-serif}
    .q-bookmark.active{background:var(--gold-light);border-color:var(--gold);color:var(--gold)}
    .q-text{font-size:16px;line-height:1.85;margin-bottom:20px;color:var(--text);font-weight:500}

    /* OPTIONS */
    .options{display:flex;flex-direction:column;gap:8px}
    .opt{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:0.5px solid var(--border);border-radius:8px;cursor:pointer;background:var(--bg);transition:all 0.15s;text-align:left;font-family:'Sarabun',sans-serif;font-size:15px;color:var(--text);line-height:1.6;width:100%}
    .opt:hover:not(.disabled){background:var(--accent-light);border-color:var(--accent2)}
    .opt.disabled{cursor:default}
    .opt.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
    .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
    .opt.selected-wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
    .opt-key{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;flex-shrink:0;margin-top:1px;min-width:18px}

    /* FEEDBACK */
    .feedback{margin-top:20px;padding:16px 20px;border-radius:8px;display:none}
    .feedback.show{display:block}
    .feedback.correct-fb{background:var(--correct-bg);border:0.5px solid var(--correct)}
    .feedback.wrong-fb{background:var(--wrong-bg);border:0.5px solid var(--wrong)}
    .fb-header{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .fb-header.correct-fb{color:var(--correct)}
    .fb-header.wrong-fb{color:var(--wrong)}
    .fb-body{font-size:14px;line-height:1.85;color:var(--text2)}
    .fb-ref{margin-top:10px;font-size:12px;color:var(--text3);border-top:0.5px solid var(--border);padding-top:8px}
    .fb-ref strong{color:var(--text2)}

    /* NAV BUTTONS */
    .nav-btns{display:flex;justify-content:space-between;margin-top:20px;gap:12px}
    .nav-btn{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:10px 20px;font-size:14px;font-family:'Sarabun',sans-serif;font-weight:500;color:var(--text2);cursor:pointer;transition:all 0.15s;flex:1;text-align:center}
    .nav-btn:hover:not(:disabled){background:var(--surface2)}
    .nav-btn:disabled{opacity:0.3;cursor:default}
    .nav-btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
    .nav-btn.primary:hover{background:var(--accent2)}

    /* SIDEBAR */
    .sidebar-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;transition:background 0.3s,border-color 0.3s}
    .sidebar-card h3{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}

    /* PROGRESS */
    .progress-bar-wrap{background:var(--bg);border-radius:20px;height:8px;overflow:hidden;margin-bottom:8px}
    .progress-bar-fill{height:100%;background:var(--accent);border-radius:20px;transition:width 0.3s}
    .progress-label{font-size:12px;color:var(--text3);font-family:'IBM Plex Mono',monospace;text-align:right}

    /* SCORE */
    .score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .score-label{font-size:13px;color:var(--text2)}
    .score-val{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--accent)}

    /* QUESTION NAV GRID */
    .q-nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
    .q-nav-btn{background:var(--bg);border:0.5px solid var(--border);border-radius:5px;padding:5px 2px;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--text3);cursor:pointer;text-align:center;transition:all 0.15s}
    .q-nav-btn:hover{background:var(--accent-light);color:var(--accent)}
    .q-nav-btn.current{background:var(--accent);color:white;border-color:var(--accent)}
    .q-nav-btn.answered-correct{background:var(--correct-bg);color:var(--correct);border-color:var(--correct)}
    .q-nav-btn.answered-wrong{background:var(--wrong-bg);color:var(--wrong);border-color:var(--wrong)}
    .q-nav-btn.bookmarked{box-shadow:0 0 0 1.5px var(--gold)}

    /* DARK MODE */
    body.dark{
      --bg:#0e1411;
      --surface:#162019;
      --surface2:#1c2820;
      --accent:#52b788;
      --accent2:#74c69d;
      --accent-light:#162d22;
      --gold:#e8b84b;
      --gold-light:#1e1a08;
      --text:#f0ede4;
      --text2:#c8c8b8;
      --text3:#737368;
      --border:rgba(255,255,255,0.09);
      --border2:rgba(255,255,255,0.055);
      --shadow: 0 1px 4px rgba(0,0,0,0.3);
      --correct:#52b788;
      --correct-bg:#0d2a1a;
      --wrong:#f87171;
      --wrong-bg:#2a0f0f;
    }
    body.dark .nav-btn.primary{color:#0e1411}
    body.dark .q-num-badge{color:#0e1411}
    body.dark .q-nav-btn.current{color:#0e1411}
    body.dark .fb-body{color:#c8c8b8}
    body.dark .fb-ref{color:#737368}
    body.dark .fb-ref strong{color:#c8c8b8}
    body.dark .score-label{color:#c8c8b8}
    body.dark .opt{color:#f0ede4}
    body.dark .opt.correct{color:#52b788}
    body.dark .opt.wrong,body.dark .opt.selected-wrong{color:#f87171}
    body.dark .q-text{color:#f0ede4}
    body.dark .hdr-title{color:#74c69d}
  </style>
</head>
<body>

<header>
  <div class="hdr-left">
    <button class="back-btn" onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'">← กลับ</button>
    <div>
      <div class="hdr-title">คลัง NL</div>
      <div class="hdr-sub">2013 · หมวด 3</div>
    </div>
  </div>
  <button class="dark-btn" id="themeBtn" onclick="toggleDark()">
    <span id="themeIcon">🌙</span>
    <span id="themeLabel">Dark Mode</span>
  </button>
</header>

<div class="layout">
  <div>
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num-badge" id="qNumBadge">ข้อ 1</span>
        <button class="q-bookmark" id="bookmarkBtn" onclick="toggleBookmark()">☆ บันทึก</button>
      </div>
      <div class="q-text" id="qText"></div>
      <div id="qImgContainer"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedback">
        <div class="fb-header" id="fbHeader"></div>
        <div class="fb-body" id="fbBody"></div>
        <div class="fb-ref" id="fbRef"></div>
      </div>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← ย้อนกลับ</button>
      <button class="nav-btn primary" id="nextBtn" onclick="navigate(1)">ถัดไป →</button>
    </div>
  </div>

  <aside class="sidebar-panel">
    <div class="sidebar-card">
      <h3>ความคืบหน้า</h3>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
      <div style="margin-top:12px">
        <div class="score-row"><span class="score-label">ตอบถูก</span><span class="score-val" id="scoreCorrect" style="color:var(--correct)">0</span></div>
        <div class="score-row"><span class="score-label">ตอบผิด</span><span class="score-val" id="scoreWrong" style="color:var(--wrong)">0</span></div>
        <div class="score-row"><span class="score-label">บันทึก</span><span class="score-val" id="scoreBookmark" style="color:var(--gold)">0</span></div>
      </div>
    </div>
    <div class="sidebar-card">
      <h3>เลือกข้อ</h3>
      <div class="q-nav-grid" id="qNavGrid"></div>
    </div>
  </aside>
</div>

<script>
const QUESTIONS = [
  {
    q:"1. เลี้ยงหมู 500 ตัว ให้อาหารสูตรดังนี้ ไลซีน 1.6% ไขมัน 9.8% แคลเซียม 0.8% ฟอสฟอรัสที่หมูใช้ได้ 0.45% พลังงาน 3150 kcal/kg โดยมีน้ำหนักแรกเข้า 6.7±0.7 kg เลี้ยงได้ 1 สัปดาห์ น้ำหนักเพิ่มเป็น 6.9±1.7 kg ต้องปรับปรุงสูตรอาหารตัวใด (ตายสะสม 3 ตัว)",
    opts:[{key:"A",text:"ไลซีน"},{key:"B",text:"ไขมัน"},{key:"C",text:"พลังงาน"},{key:"D",text:"แคลเซียม"},{key:"E",text:"ฟอสฟอรัส"}],
    answer:"B",
    explanation:"น้ำหนักที่เพิ่มขึ้นน้อยมาก (6.7→6.9 kg ใน 1 สัปดาห์) ร่วมกับ SD ที่เพิ่มขึ้น (±0.7→±1.7) และมีการตายสะสม ชี้ให้เห็นว่าหมูบางตัวไม่เติบโต ในลูกหมูแรกเข้า (starter) พลังงานและไขมันมีความสำคัญมาก โดยไขมัน 9.8% ถือว่าสูงเกินไปสำหรับอาหาร starter ซึ่งปกติไม่เกิน 5-6% ไขมันสูงเกินไปทำให้ palatability ลดลงและอาจรบกวนการดูดซึมสารอาหารอื่น",
    ref:"NRC. Nutrient Requirements of Swine. 11th ed. National Academies Press; 2012. | Patience JF, Thacker PA, de Lange CFM. Swine Nutrition Guide. 2nd ed. Prairie Swine Centre; 1995."
  },
  {
    q:"2. เป็ดเชอร์รี่ อายุ 6 สัปดาห์ เลี้ยงในระบบเปิด พื้นซีเมนต์ขรุขระและมีน้ำขัง น้ำที่ใช้เลี้ยงเป็นน้ำบาดาล พบว่า 2 สัปดาห์ก่อน เปิดมีอาการซึม ไม่ลุก จึงทำการเปลี่ยนอาหารเป็นสูตรเป็ดขุน 7 วันก่อนจับขาย เป็ดมีอัตราการป่วยและตายเพิ่มขึ้น ความผิดปกติดังกล่าวเกิดขึ้นจากปัจจัยใด",
    opts:[{key:"A",text:"สภาพแวดล้อมภายในฟาร์ม"},{key:"B",text:"พื้นที่ใช้เลี้ยง"},{key:"C",text:"วิธีจับบังคับเป็ดส่งขาย"},{key:"D",text:"น้ำหนักเป็ดอายุ 1 วัน"},{key:"E",text:"อายุเป็ดจับขาย"}],
    answer:"A",
    explanation:"พื้นซีเมนต์ขรุขระมีน้ำขัง เป็นสภาพแวดล้อมที่ไม่เหมาะสม ทำให้เป็ดบาดเจ็บที่ฝ่าเท้าและเกิดการติดเชื้อได้ง่าย (bumblefoot/pododermatitis) รวมถึงน้ำบาดาลอาจมีแร่ธาตุหรือเชื้อโรคที่ก่อปัญหา สภาพแวดล้อมภายในฟาร์มที่ไม่ถูกสุขลักษณะเป็นปัจจัยหลักที่ทำให้เกิดการป่วยและตายเพิ่มขึ้น",
    ref:"Merck Veterinary Manual. Poultry Management. 12th ed.; 2023. | Leeson S, Summers JD. Commercial Poultry Nutrition. 3rd ed. University Books; 2005."
  },
  {
    q:"3. ม้าอายุ 7 ปี อัตราการผสมติดเมื่อฤดูกาลที่แล้วเป็น 85% ปัจจุบันรีดน้ำเชื้อได้ปริมาตร 40 cc ความเข้มข้น 120 ล้านเซลล์/cc สีขาว-ครีมขุ่น total motility 75%, progress motile 65%, primary abnormal morphology 15%, secondary abnormal 10% และ 15 polymorphic nucleated cell/field จงหาความเป็นไปได้ว่าจะเป็นโรคใด",
    opts:[{key:"A",text:"Urethritis"},{key:"B",text:"Funiculitis"},{key:"C",text:"Orchitis"},{key:"D",text:"Balanoposthitis"},{key:"E",text:"Seminal vasculitis"}],
    answer:"E",
    explanation:"พบ polymorphic nucleated cell (PMN) 15 cell/field ในน้ำเชื้อ ร่วมกับ primary abnormal morphology 15% ชี้ถึงการอักเสบในระบบสืบพันธุ์ส่วนต้น Seminal vasculitis (การอักเสบของ seminal vesicle) ทำให้พบ PMN ในน้ำเชื้อสูง และส่งผลต่อ morphology ของอสุจิ โดยที่ motility ยังค่อนข้างดี (75%) สอดคล้องกับ vasiculitis มากกว่า orchitis ที่จะส่งผลต่อ motility มากกว่า",
    ref:"Blanchard TL, Varner DD, Schumacher J. Manual of Equine Reproduction. 3rd ed. Mosby Elsevier; 2011. | McKinnon AO, Squires EL, Vaala WE, Varner DD. Equine Reproduction. 2nd ed. Wiley-Blackwell; 2011."
  },
  {
    q:"4. สุนัขเพศผู้ อายุ 10 ปี มีอาการผิดปกติไปจากเดิม ซึม กินอาหารได้ปกติ ขนร่วงแบบสมมาตรบริเวณข้างลำตัว และขนหางร่วงเกือบทั้งหมด ไม่คัน ขนแห้ง หยิบออกง่าย การวินิจฉัยโรคข้อใดเป็นไปได้มากที่สุด",
    opts:[{key:"A",text:"Atopy"},{key:"B",text:"Food allergy"},{key:"C",text:"Hypothyroidism"},{key:"D",text:"Selenium deficiency"},{key:"E",text:"Hypoadrenocortidism"}],
    answer:"C",
    explanation:"Hypothyroidism ในสุนัขมักพบในสุนัขอายุมาก อาการขนร่วงแบบสมมาตร (bilateral symmetric alopecia) ขนแห้งและหลุดง่าย ไม่คัน ซึมเซา น้ำหนักขึ้น กินอาหารปกติ เป็นอาการคลาสสิกของภาวะพร่องฮอร์โมนไทรอยด์ ต่างจาก Atopy และ Food allergy ที่จะมีอาการคัน",
    ref:"Nelson RW, Couto CG. Small Animal Internal Medicine. 5th ed. Elsevier Mosby; 2014. | Feldman EC, Nelson RW. Canine and Feline Endocrinology and Reproduction. 3rd ed. Saunders; 2004."
  },
  {
    q:"5. สุนัขพันธุ์ Rottweiler อายุ 8 ปี ข้อขาหน้าขวาบวม ไม่ใช้ขา 3 เดือน x-ray พบ new bone formation ที่ metaphysis, bone destruction และ radial fracture สาเหตุเกิดจากอะไร",
    opts:[{key:"A",text:"Osteopenia"},{key:"B",text:"Osteoporosis"},{key:"C",text:"Osteomyelitis"},{key:"D",text:"Osteosarcoma"},{key:"E",text:"Osteodystrophy"}],
    answer:"D",
    explanation:"Osteosarcoma (OSA) พบบ่อยในสุนัขพันธุ์ใหญ่อายุมาก เช่น Rottweiler ลักษณะ x-ray ที่พบ new bone formation (sunburst pattern), bone destruction ที่ metaphysis และ pathological fracture เป็น hallmark ของ osteosarcoma ต้องแยกจาก osteomyelitis ซึ่งมักมีประวัติการติดเชื้อและอาการเฉียบพลันมากกว่า",
    ref:"Withrow SJ, Vail DM, Page RL. Withrow and MacEwen's Small Animal Clinical Oncology. 5th ed. Elsevier Saunders; 2013. | Tobias KM, Johnston SA. Veterinary Surgery: Small Animal. 2nd ed. Elsevier Saunders; 2018."
  },
  {
    q:"6. ผ่าซากสุกร 3 ตัวพบ lung congestion, splenomegaly, white foci at liver, ulcer and necrotic membrane at ileocecal junction, lymphadenopathy, enteritis สุกรเป็นโรคใด",
    opts:[{key:"A",text:"Colibacillosis"},{key:"B",text:"Salmonellosis"},{key:"C",text:"Coccidiosis"},{key:"D",text:"Cryptosporidiosis"},{key:"E",text:"Transmissible gastroenteritis"}],
    answer:"B",
    explanation:"รอยโรคที่พบสอดคล้องกับ Salmonellosis ในสุกร โดยเฉพาะ Salmonella choleraesuis: white foci (multifocal necrosis) ที่ตับ, splenomegaly, ulcer และ necrotic membrane ที่ ileocecal junction (button ulcer), lymphadenopathy และ enteritis ล้วนเป็นรอยโรคคลาสสิกของ Salmonellosis",
    ref:"Zimmerman JJ, Karriker LA, Ramirez A, et al. Diseases of Swine. 11th ed. Wiley-Blackwell; 2019. | Straw BE, Zimmerman JJ, D'Allaire S, Taylor DJ. Diseases of Swine. 9th ed. Blackwell Publishing; 2006."
  },

// STATE
let current = 0;
const state = {
  answered: {},
  bookmarks: new Set()
};

// RENDER
function render() {
  const q = QUESTIONS[current];
  const ans = state.answered[current];
  const isAnswered = ans !== undefined;

  document.getElementById('qNumBadge').textContent = `ข้อ ${q.q.match(/^\d+/)[0]}`;

  const bm = document.getElementById('bookmarkBtn');
  if (state.bookmarks.has(current)) {
    bm.textContent = '★ บันทึกแล้ว';
    bm.classList.add('active');
  } else {
    bm.textContent = '☆ บันทึก';
    bm.classList.remove('active');
  }

  document.getElementById('qText').textContent = q.q;

  const imgContainer = document.getElementById('qImgContainer');
  imgContainer.innerHTML = q.img ? `<img src="${q.img}" alt="ภาพประกอบ" style="max-width:100%;border-radius:8px;margin-bottom:16px;border:0.5px solid var(--border);">` : '';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${opt.key}.</span><span>${opt.text}</span>`;
    if (isAnswered) {
      btn.classList.add('disabled');
      if (opt.key === q.answer) btn.classList.add('correct');
      else if (opt.key === ans && ans !== q.answer) btn.classList.add('selected-wrong');
    } else {
      btn.addEventListener('click', () => answer(opt.key));
    }
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  const fbHeader = document.getElementById('fbHeader');
  const fbBody = document.getElementById('fbBody');
  const fbRef = document.getElementById('fbRef');

  if (isAnswered) {
    fb.classList.add('show');
    const correct = ans === q.answer;
    fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.className = `fb-header ${correct ? 'correct-fb' : 'wrong-fb'}`;
    fbHeader.textContent = correct ? '✓ ถูกต้อง!' : `✗ ไม่ถูกต้อง — คำตอบที่ถูกคือ ข้อ ${q.answer}`;
    fbBody.textContent = q.explanation;
    fbRef.innerHTML = `<strong>แหล่งอ้างอิง:</strong> ${q.ref}`;
  } else {
    fb.className = 'feedback';
  }

  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'สรุปผล' : 'ถัดไป →';

  updateSidebar();
}

function answer(key) {
  state.answered[current] = key;
  render();
}

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next > QUESTIONS.length - 1) {
    if (current === QUESTIONS.length - 1 && dir === 1) showSummary();
    return;
  }
  current = next;
  render();
}

function goToQuestion(idx) {
  current = idx;
  render();
}

function toggleBookmark() {
  if (state.bookmarks.has(current)) {
    state.bookmarks.delete(current);
  } else {
    state.bookmarks.add(current);
  }
  render();
}

function updateSidebar() {
  const answered = Object.keys(state.answered).length;
  const total = QUESTIONS.length;
  const correct = Object.entries(state.answered).filter(([i, k]) => k === QUESTIONS[i].answer).length;
  const wrong = answered - correct;

  document.getElementById('progressFill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progressLabel').textContent = `${answered} / ${total}`;
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = wrong;
  document.getElementById('scoreBookmark').textContent = state.bookmarks.size;

  const grid = document.getElementById('qNavGrid');
  grid.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'q-nav-btn';
    btn.textContent = q.q.match(/^\d+/)[0];
    if (idx === current) btn.classList.add('current');
    else if (state.answered[idx] !== undefined) {
      if (state.answered[idx] === QUESTIONS[idx].answer) btn.classList.add('answered-correct');
      else btn.classList.add('answered-wrong');
    }
    if (state.bookmarks.has(idx)) btn.classList.add('bookmarked');
    btn.onclick = () => goToQuestion(idx);
    grid.appendChild(btn);
  });
}

function showSummary() {
  const total = QUESTIONS.length;
  const answered = Object.keys(state.answered).length;
  const correct = Object.entries(state.answered).filter(([i,k]) => k === QUESTIONS[i].answer).length;
  const pct = answered > 0 ? Math.round((correct/answered)*100) : 0;
  alert(`สรุปผล\n\nตอบแล้ว: ${answered}/${total} ข้อ\nถูก: ${correct} ข้อ\nผิด: ${answered - correct} ข้อ\nคะแนน: ${pct}%`);
}

function toggleDark() {
  const dark = document.body.classList.toggle('dark');
  document.getElementById('themeIcon').textContent = dark ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = dark ? 'Light Mode' : 'Dark Mode';
  localStorage.setItem('theme', dark ? 'dark' : 'light');
}

if(localStorage.getItem('theme') === 'dark'){
  document.body.classList.add('dark');
  document.getElementById('themeIcon').textContent = '☀️';
  document.getElementById('themeLabel').textContent = 'Light Mode';
}

render();
</script>
