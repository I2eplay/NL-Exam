
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.quiz-wrap{display:flex;gap:0;min-height:600px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.main{flex:1;padding:2rem;display:flex;flex-direction:column;gap:1.5rem;min-width:0}
.sidebar{width:220px;border-left:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);padding:1.25rem;display:flex;flex-direction:column;gap:1rem;flex-shrink:0}
.progress-bar-wrap{background:var(--color-border-tertiary);border-radius:999px;height:6px;overflow:hidden}
.progress-bar{height:6px;border-radius:999px;background:#1D9E75;transition:width 0.3s}
.q-meta{font-size:13px;color:var(--color-text-secondary)}
.q-num{font-size:22px;font-weight:500;color:var(--color-text-primary)}

.keyword{font-size:12px;color:var(--color-text-tertiary);font-style:italic}
.options{display:flex;flex-direction:column;gap:10px;margin-top:0.5rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;transition:background 0.15s,border-color 0.15s;background:var(--color-background-primary);text-align:left;font-size:14px;color:var(--color-text-primary);line-height:1.5}
.opt:hover{background:var(--color-background-secondary);border-color:var(--color-border-secondary)}
.opt.selected{border-color:#1D9E75;background:#E1F5EE;color:#085041}
.opt.correct{border-color:#1D9E75;background:#E1F5EE;color:#085041}
.opt.wrong{border-color:#D85A30;background:#FAECE7;color:#4A1B0C}
.opt-label{font-weight:500;min-width:16px;flex-shrink:0}
.nav{display:flex;gap:10px;margin-top:auto}
.btn{padding:8px 20px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:14px;cursor:pointer;transition:background 0.15s}
.btn:hover{background:var(--color-background-secondary)}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.btn-primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-primary:hover{background:#0F6E56}
.sidebar-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.05em}
.total-num{font-size:32px;font-weight:500;color:var(--color-text-primary)}
.total-label{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.score-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.q-dot{width:28px;height:28px;border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);transition:background 0.1s}
.q-dot:hover{background:var(--color-background-secondary)}
.q-dot.current{border-color:#1D9E75;color:#0F6E56;font-weight:500}
.q-dot.answered{background:#9FE1CB;border-color:#5DCAA5;color:#085041}
.q-dot.correct-dot{background:#9FE1CB;border-color:#5DCAA5;color:#085041}
.q-dot.wrong-dot{background:#F5C4B3;border-color:#F0997B;color:#4A1B0C}
.answer-reveal{margin-top:0.5rem;padding:10px 14px;border-radius:var(--border-radius-md);font-size:14px;border:0.5px solid #5DCAA5;background:#E1F5EE;color:#085041}

<div class="quiz-wrap">

</div>

<script>

  {q:"ไก่เนื้ออายุ 21 วัน ถ่ายเหลวเป็นน้ำ พบวิการที่เยื่อเมือกของ duodenum",opts:["E.mitis","E.tenella","E.praecox","E.maxima","E.acervulina"],ans:4,kw:"Eimeria, Poultry"},

  {q:"ข้อใดเป็นโรคที่ต้องตรวจในม้าเพื่อการเคลื่อนย้ายตาม พ.ร.บ.โรคระบาดสัตว์ พ.ศ. 2558",opts:["Equine arthritis","Equine strangles","Equine herpesvirus","Equine influenza virus","Equine infectious anemia"],ans:4,kw:"กฎหมาย, Equine"},
  {q:"สุกร 2-3 วัน ท้องเสียเป็นสีเหลือง ไม่อาเจียน อัตราป่วย 20% อัตราตาย 5-10% ถ้าต้องการทำวัคซีนป้องกัน virulence factor ใดที่ควรมีในวัคซีน",opts:["F4","O148","O149","O157:H7","Shiga-like toxin"],ans:0,kw:"E.coli, Swine"},
  {q:"ข้อใดนิยมให้ในโคนมเพื่อแก้ไขภาวะ ketosis",opts:["Dextrose","Sodium chloride","Liquid paraffin","Magnesium sulfate","Sodium bicarbonate"],ans:0,kw:"Bovine, Ketosis"},

  {q:"โคลักลอบนำเข้า ตายจำนวนมาก ซากไม่แข็ง มีเลือดออกจากรูเปิด สงสัยติดเชื้อในกระแสเลือด ใช้อะไรย้อม blood smear",opts:["Gram stain","Spore stain","Ziehl Neelsen stain","Modified Ziehl Neelsen stain","Polychrome methylene blue"],ans:4,kw:"Anthrax, Staining"}
];

const labels = ['ก','ข','ค','ง','จ'];
let cur = 0;
let userAns = new Array(questions.length).fill(-1);
let revealed = new Array(questions.length).fill(false);

function render() {
  const q = questions[cur];
  const total = questions.length;
  document.getElementById('q-meta').textContent = `ข้อ ${cur+1} จาก ${total}`;
  document.getElementById('q-num').textContent = `ข้อ ${cur+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-kw').textContent = q.kw ? `Keyword: ${q.kw}` : '';
  document.getElementById('prog').style.width = Math.max(1,Math.round((cur+1)/total*100))+'%';
  document.getElementById('total-num').textContent = total;

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o,i) => {
    if(!o) return;
    const btn = document.createElement('button');
    btn.className = 'opt';
    let cls = '';
    if(revealed[cur]) {
      if(i === q.ans) cls = 'correct';
      else if(i === userAns[cur] && userAns[cur] !== q.ans) cls = 'wrong';
    } else if(userAns[cur] === i) cls = 'selected';
    if(cls) btn.classList.add(cls);
    btn.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${o}</span>`;
    btn.onclick = () => pick(i);
    if(revealed[cur]) btn.disabled = true;
    opts.appendChild(btn);
  });

  const ab = document.getElementById('answer-box');
  if(revealed[cur] && q.ans >= 0) {
    ab.style.display = 'block';
    ab.textContent = `เฉลย: ${labels[q.ans]} ${q.opts[q.ans]}`;
  } else {
    ab.style.display = 'none';
  }

  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').textContent = cur === total-1 ? 'สรุปผล' : 'ถัดไป →';

  let correct = 0, wrong = 0;
  userAns.forEach((a,i)=>{
    if(a >= 0 && revealed[i]) {
      if(a === questions[i].ans) correct++;
      else wrong++;
    }
  });
  document.getElementById('score-correct').textContent = correct;
  document.getElementById('score-wrong').textContent = wrong;

  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  questions.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = 'q-dot';
    d.textContent = i+1;
    if(i === cur) d.classList.add('current');
    if(revealed[i]) {
      if(userAns[i] === questions[i].ans) d.classList.add('correct-dot');
      else if(userAns[i] >= 0) d.classList.add('wrong-dot');
      else d.classList.add('answered');
    } else if(userAns[i] >= 0) d.classList.add('answered');
    d.onclick = () => { cur = i; render(); };
    grid.appendChild(d);
  });
}

function pick(i) {
  if(revealed[cur]) return;
  userAns[cur] = i;
  revealed[cur] = true;
  render();
}

function go(dir) {
  const total = questions.length;
  if(dir > 0 && cur === total-1) {
    let correct = 0, wrong = 0, skipped = 0;
    userAns.forEach((a,i)=>{
      if(a < 0) skipped++;
      else if(a === questions[i].ans) correct++;
      else wrong++;
    });
    alert(`สรุปผล\nถูก: ${correct}\nผิด: ${wrong}\nยังไม่ตอบ: ${skipped}\nคะแนน: ${correct}/${total}`);
    return;
  }
  cur = Math.max(0, Math.min(total-1, cur+dir));
  render();
}

render();
</script>
